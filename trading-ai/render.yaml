# Render Blueprint — YASHWIN AI Trading Assistant (Paper Mode Only)
services:
  - type: web
    name: yashwin-ai-trading
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: yashwin-sqlite-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRADING_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: YASHWIN_DB_PATH
        value: server/data/yashwin-trading.sqlite
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_ID
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
