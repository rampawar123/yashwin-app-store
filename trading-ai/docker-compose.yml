services:
  yashwin-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yashwin-ai-trading
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: 3000
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      YASHWIN_DB_PATH: /app/server/data/yashwin-trading.sqlite
    volumes:
      - yashwin_sqlite_data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  yashwin_sqlite_data:
    name: yashwin_sqlite_data
