<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YASHWIN APP STORE</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#101010;
  color:#fff;
}

header{
  background:#181818;
  border-bottom:3px solid #ff9800;
  position:sticky;
  top:0;
  z-index:100;
}

.header{
  max-width:1100px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#ff9800;
  font-size:25px;
  font-weight:bold;
}

.menu-btn{
  background:#ff9800;
  color:#111;
  border:0;
  border-radius:12px;
  font-size:22px;
  padding:8px 14px;
  cursor:pointer;
}

nav{
  display:none;
  background:#222;
  padding:12px 20px;
}

nav.show{
  display:block;
}

nav button{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:0;
  border-radius:10px;
  background:#ff9800;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.hero{
  text-align:center;
}

.hero h1{
  color:#ff9800;
  font-size:42px;
  margin-bottom:15px;
}

.hero p{
  color:#ccc;
  font-size:19px;
}

.search{
  display:flex;
  margin:35px auto;
  max-width:700px;
}

.search input{
  flex:1;
  padding:16px;
  border:1px solid #555;
  border-radius:14px 0 0 14px;
  background:#222;
  color:#fff;
  font-size:17px;
  outline:none;
}

.search button{
  width:90px;
  border:0;
  border-radius:0 14px 14px 0;
  background:#ff9800;
  font-size:18px;
  cursor:pointer;
}

.section-title{
  color:#ff9800;
  font-size:30px;
  margin:30px 0 20px;
}

.apps{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.app{
  background:#1d1d1d;
  border:1px solid #333;
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.app img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:20px;
  margin-bottom:15px;
}

.app h3{
  font-size:22px;
  margin-bottom:8px;
}

.app p{
  color:#aaa;
  margin-bottom:18px;
}

.app button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#ff9800;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  display:none;
  text-align:center;
  color:#aaa;
  padding:30px;
}

footer{
  margin-top:50px;
  padding:25px;
  text-align:center;
  background:#181818;
  color:#888;
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">YASHWIN APP STORE</div>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
  </div>

  <nav id="menu">
    <button onclick="scrollToApps()">Apps</button>
    <button onclick="showAbout()">About</button>
  </nav>
</header>

<main class="container">

  <section class="hero">
    <h1>YASHWIN APP STORE</h1>
    <p>Download useful apps made for everyone.</p>
  </section>

  <div class="search">
    <input
      id="searchInput"
      type="text"
      placeholder="Search apps..."
      oninput="searchApps()"
    >
    <button onclick="searchApps()">🔍</button>
  </div>

  <h2 class="section-title" id="apps">Available Apps</h2>

  <div class="apps" id="appList">

    <div class="app" data-name="VANSH CALCULATOR">
      <img src="calculator-logo.png" alt="VANSH CALCULATOR">
      <h3>VANSH CALCULATOR</h3>
      <p>Simple and fast calculator.</p>
      <a href="https://github.com/rampawar123/yashwin-app-store/releases/download/v1.0-final/app-release-signed.apk"
   class="download-btn"
   download>
   Download APK
        <button onclick="openCalculator()">Open App</button>
      </a>
      <button class="share-btn" onclick="shareApp()">
  🔗 Share App
      </button>
    </div>

    <div class="app" data-name="YASHWIN APP STORE">
      <img src="./icon-192.png" alt="YASHWIN APP STORE">
      <h3>YASHWIN APP STORE</h3>
      <p>Your personal app store.</p>
      <a href="https://github.com/rampawar123/yashwin-app-store/releases/download/v1.0-final/app-release-signed.apk"
class="download-btn"
download>
Download APK
      </a>
      <button onclick="location.reload()">Open App</button>
      <button class="share-btn" onclick="shareAppStore()">
  🔗 Share App Store
      </button>
    </div>

  </div>

  <div class="empty" id="empty">
    No app found.
  </div>

</main>

<footer>
  © 2026 YASHWIN APP STORE
</footer>

<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("show");
}

function scrollToApps(){
  document.getElementById("apps").scrollIntoView({
    behavior:"smooth"
  });
}

function searchApps(){
  const value=document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  const apps=document.querySelectorAll(".app");
  let found=0;

  apps.forEach(app=>{
    const name=app.dataset.name.toLowerCase();

    if(name.includes(value)){
      app.style.display="block";
      found++;
    }else{
      app.style.display="none";
    }
  });

  document.getElementById("empty").style.display =
    found===0 ? "block" : "none";
}

function openCalculator(){
  window.location.href="./calculator.html";
}

function showAbout(){
  alert(
    "YASHWIN APP STORE\n\n" +
    "A personal app store project."
  );
}
  function shareApp(){
  if(navigator.share){
    navigator.share({
      title: "VANSH CALCULATOR",
      text: "VANSH CALCULATOR डाउनलोड करें",
      url: window.location.href
    });
  }else{
    navigator.clipboard.writeText(window.location.href);
    alert("Calculator link copied!");
  }
}

function shareAppStore(){
  if(navigator.share){
    navigator.share({
      title: "YASHWIN APP STORE",
      text: "YASHWIN APP STORE से apps download करें",
      url: window.location.href
    });
  }else{
    navigator.clipboard.writeText(window.location.href);
    alert("App Store link copied!");
  }
}
</script>

</body>
</html>
