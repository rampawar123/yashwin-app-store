<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YASHWIN APP STORE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: #1f1f1f;
    }

    header h1 {
      margin: 0;
      color: #ff9800;
      font-size: 30px;
    }

    header p {
      color: #ccc;
      margin-bottom: 0;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .app-card {
      background: #222;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .app-icon {
      width: 75px;
      height: 75px;
      border-radius: 18px;
      object-fit: cover;
    }

    .app-info {
      flex: 1;
    }

    .app-info h2 {
      margin: 0 0 8px;
      color: #ff9800;
      font-size: 21px;
    }

    .app-info p {
      margin: 0 0 12px;
      color: #ccc;
      font-size: 14px;
    }

    .button {
      display: inline-block;
      padding: 10px 18px;
      background: #ff9800;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>YASHWIN APP STORE</h1>
    <p>Discover, Download and Enjoy Apps</p>
  </header>

  <div class="container">

    <div class="app-card">

      <img class="app-icon" src="icon-192.png" alt="VANSH CALCULATOR">

      <div class="app-info">
        <h2>VANSH CALCULATOR</h2>

        <p>Fast and simple calculator app.</p>

        <a class="button" href="calculator.html">
          OPEN APP
        </a>
      </div>

    </div>

  </div>

  <footer>
    © 2026 YASHWIN APP STORE
  </footer>

</body>
</html>
