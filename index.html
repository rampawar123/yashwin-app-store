<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#ff9800">

<link rel="manifest" href="./manifest.json">

<title>YASHWIN APP STORE</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #101010;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */
.store-header {
    background: #181818;
    border-bottom: 1px solid #333;
    padding: 18px 24px;
}

.header-row {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.store-name {
    color: #ff9800;
    font-size: 28px;
    font-weight: bold;
}

.menu-button {
    background: #292929;
    color: white;
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 28px;
}

/* NAV */
.nav {
    max-width: 1100px;
    margin: auto;
    padding: 14px 24px;
    display: flex;
    gap: 12px;
}

.nav-button {
    border: 0;
    border-radius: 12px;
    padding: 14px 22px;
    background: #292929;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.nav-button.active {
    background: #ff9800;
    color: #111;
}

/* HERO */
.hero {
    max-width: 1000px;
    margin: 0 auto;
    padding: 55px 20px 35px;
    text-align: center;
}

.hero h1 {
    margin: 0;
    color: #ff9800;
    font-size: clamp(38px, 8vw, 64px);
    line-height: 1.1;
}

.hero p {
    margin: 22px 0 35px;
    color: #d0d0d0;
    font-size: 22px;
}

/* SEARCH */
.search-box {
    width: 100%;
    max-width: 650px;
    margin: auto;
    display: flex;
    background: #242424;
    border: 1px solid #555;
    border-radius: 18px;
    overflow: hidden;
}

.search-box input {
    flex: 1;
    min-width: 0;
    padding: 18px;
    border: 0;
    outline: none;
    background: transparent;
    color: white;
    font-size: 20px;
}

.search-box input::placeholder {
    color: #888;
}

.search-button {
    width: 115px;
    border: 0;
    background: #ff9800;
    font-size: 28px;
}

/* APPS */
.apps-section {
    max-width: 1100px;
    margin: auto;
    padding: 20px 24px 60px;
}

.section-title {
    color: #ff9800;
    font-size: 40px;
    margin: 20px 0 30px;
}

/* APP CARD */
.app-card {
    width: 100%;
    background: #222;
    border: 1px solid #3b3b3b;
    border-radius: 28px;
    padding: 25px;
    display: flex;
    align-items: center;
    gap: 25px;
}

.app-icon {
    width: 145px;
    height: 145px;
    object-fit: cover;
    border-radius: 25px;
    flex-shrink: 0;
}

.app-info {
    flex: 1;
    min-width: 0;
}

.app-info h2 {
    margin: 0 0 10px;
    color: white;
    font-size: 30px;
}

.app-info p {
    margin: 0 0 14px;
    color: #bdbdbd;
    font-size: 18px;
}

.app-meta {
    color: #999;
    font-size: 16px;
    margin-bottom: 18px;
}

.open-button {
    display: inline-block;
    text-decoration: none;
    background: #ff9800;
    color: #111;
    border-radius: 12px;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: bold;
}

/* COMING SOON */
.coming-soon {
    margin-top: 35px;
    padding: 35px 20px;
    text-align: center;
    background: #191919;
    border: 1px dashed #555;
    border-radius: 25px;
}

.coming-soon h2 {
    margin: 0 0 12px;
    color: #ff9800;
    font-size: 28px;
}

.coming-soon p {
    margin: 0;
    color: #aaa;
    font-size: 18px;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 35px 20px;
    color: #777;
    border-top: 1px solid #222;
}

/* MOBILE */
@media (max-width: 600px) {

    .store-header {
        padding: 18px 24px;
    }

    .store-name {
        font-size: 26px;
    }

    .menu-button {
        font-size: 25px;
        padding: 9px 14px;
    }

    .nav {
        padding: 12px 24px;
    }

    .nav-button {
        padding: 12px 18px;
        font-size: 17px;
    }

    .hero {
        padding: 35px 18px 25px;
    }

    .hero h1 {
        font-size: 42px;
    }

    .hero p {
        font-size: 19px;
    }

    .search-box {
        border-radius: 15px;
    }

    .search-button {
        width: 85px;
    }

    .apps-section {
        padding: 15px 24px 45px;
    }

    .section-title {
        font-size: 38px;
    }

    .app-card {
        padding: 22px;
        flex-direction: column;
        text-align: left;
        align-items: stretch;
        gap: 18px;
    }

    .app-icon {
        width: 140px;
        height: 140px;
    }

    .app-info h2 {
        font-size: 28px;
    }

    .app-info p {
        font-size: 17px;
    }

    .open-button {
        text-align: center;
        width: 100%;
    }

    .coming-soon {
        padding: 30px 18px;
    }
}
</style>
</head>

<body>

<header class="store-header">
    <div class="header-row">

        <div class="store-name">
            YASHWIN APP STORE
        </div>

        <button class="menu-button" type="button">
            ☰
        </button>

    </div>

    <nav class="nav">

        <button class="nav-button active" type="button">
            📱 Apps
        </button>

        <button class="nav-button" type="button"
                onclick="showAbout()">
            ℹ️ About
        </button>

    </nav>
</header>


<main>

<section class="hero">

    <h1>YASHWIN APP STORE</h1>

    <p>
        Discover, Download and Enjoy Apps
    </p>

    <div class="search-box">

        <input
            id="searchInput"
            type="search"
            placeholder="Search apps..."
            autocomplete="off">

        <button
            class="search-button"
            type="button"
            onclick="searchApps()">
            🔍
        </button>

    </div>

</section>


<section class="apps-section">

    <h2 class="section-title">
        📱 Apps
    </h2>


    <div class="app-card" id="calculatorCard">

        <img
            class="app-icon"
            src="./icon-192.png"
            alt="VANSH CALCULATOR">

        <div class="app-info">

            <h2>VANSH CALCULATOR</h2>

            <p>
                Fast, simple and powerful calculator.
            </p>

            <div class="app-meta">
                🧮 Calculator &nbsp; • &nbsp; v1.0
            </div>

            <a
                class="open-button"
                href="./app-details.html">
                OPEN APP
            </a>

        </div>

    </div>


    <div class="coming-soon">

        <h2>
            🚀 More Apps Coming Soon
        </h2>

        <p>
            New apps will be added to
            YASHWIN APP STORE.
        </p>

    </div>

</section>

</main>


<footer class="footer">
    © 2026 YASHWIN APP STORE
</footer>


<script>
function searchApps() {

    const input =
        document.getElementById("searchInput");

    const card =
        document.getElementById("calculatorCard");

    const text =
        input.value.toLowerCase().trim();

    if (
        text === "" ||
        text.includes("vansh") ||
        text.includes("calculator")
    ) {
        card.style.display = "flex";
    } else {
        card.style.display = "none";
    }
}


function showAbout() {

    alert(
        "YASHWIN APP STORE\n\n" +
        "Discover, Download and Enjoy Apps."
    );

}


/* Service Worker */
if ("serviceWorker" in navigator) {

    window.addEventListener("load", function () {

        navigator.serviceWorker
            .register("./sw.js")
            .then(function () {

                console.log(
                    "YASHWIN APP STORE Service Worker registered."
                );

            })
            .catch(function (error) {

                console.error(
                    "Service Worker registration failed:",
                    error
                );

            });

    });

}
</script>

</body>
</html>
