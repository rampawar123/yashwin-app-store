<img class="store-logo" src="https://i.ibb.co/5x8V3TnH/yashwin-app-store-logo.png" alt="YASHWIN APP STORE">
<link rel="stylesheet" href="style.css">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#ff9800">

  <meta name="description" content="YASHWIN APP STORE - Discover, Download and Enjoy Apps">

  <link rel="manifest" href="manifest.json">

  <link rel="icon" href="icon.svg">

  <title>YASHWIN APP STORE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: #1f1f1f;
    }

    header h1 {
      margin: 0;
      color: #ff9800;
      font-size: 30px;
    }

    header p {
      color: #ccc;
      margin-bottom: 0;
      font-size: 16px;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .app-card {
      background: #222;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .app-icon {
      width: 75px;
      height: 75px;
      border-radius: 18px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .app-info {
      flex: 1;
    }

    .app-info h2 {
      margin: 0 0 8px;
      color: #ff9800;
      font-size: 21px;
    }

    .app-info p {
      margin: 0 0 12px;
      color: #ccc;
      font-size: 14px;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      background: #ff9800;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    .button:active {
      transform: scale(0.96);
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 26px;
      }

      .app-card {
        padding: 15px;
      }

      .app-icon {
        width: 65px;
        height: 65px;
      }

      .app-info h2 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>YASHWIN APP STORE</h1>
    <p>Discover, Download and Enjoy Apps</p>
  </header>

  <main class="container">

    <div class="app-card">

      <img
        class="app-icon"
        src="icon-192.png"
        alt="VANSH CALCULATOR"
      >

      <div class="app-info">

        <h2>VANSH CALCULATOR</h2>

        <p>Fast and simple calculator app.</p>

        <a
          class="button"
          href="calculator.html"
        >
          OPEN APP
        </a>

      </div>

    </div>

  </main>

  <footer>
    © 2026 YASHWIN APP STORE
  </footer>

  <script>
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("sw.js")
          .then(() => {
            console.log("YASHWIN APP STORE ready");
          })
          .catch((error) => {
            console.log("Service Worker error:", error);
          });

      });

    }
  </script>

</body>
</html>
<script src="script.js"></script>
