<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YASHWIN APP STORE</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">    
<link rel="manifest" href="manifest.json">   

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    background:#181818;
    padding:18px 24px;
    border-bottom:1px solid #333;
    position:sticky;
    top:0;
    z-index:10;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-title{
    color:#ff9800;
    font-size:26px;
    font-weight:bold;
}

.menu-btn{
    background:#292929;
    color:white;
    border:0;
    border-radius:12px;
    font-size:30px;
    padding:5px 14px;
    cursor:pointer;
}

.menu{
    display:none;
    margin-top:15px;
}

.menu button{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    background:#ff9800;
    font-size:17px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:35px 20px;
}

h1{
    text-align:center;
    color:#ff9800;
    font-size:46px;
}

.subtitle{
    text-align:center;
    color:#ccc;
    font-size:22px;
}

.search{
    display:flex;
    margin:35px 0;
}

.search input{
    flex:1;
    padding:18px;
    border-radius:15px 0 0 15px;
    border:1px solid #555;
    background:#222;
    color:white;
    font-size:18px;
}

.search button{
    width:90px;
    border:0;
    border-radius:0 15px 15px 0;
    background:#ff9800;
    font-size:25px;
}

.section-title{
    color:#ff9800;
    font-size:38px;
    margin-top:40px;
}

.app-card{
    background:#222;
    border:1px solid #444;
    border-radius:25px;
    padding:25px;
    margin-top:20px;
    text-align:center;
}

.app-card img{
    width:180px;
    max-width:70%;
    border-radius:25px;
}

.app-card h2{
    font-size:30px;
}

.app-card p{
    color:#ccc;
    font-size:18px;
}

.btn{
    display:block;
    width:100%;
    padding:17px;
    margin-top:15px;
    border:0;
    border-radius:14px;
    background:#ff9800;
    color:#111;
    font-size:20px;
    font-weight:bold;
    text-decoration:none;
}

.install{
    background:#333;
    color:white;
    border:2px solid #ff9800;
}

.coming{
    margin-top:30px;
    padding:30px;
    border:1px dashed #777;
    border-radius:25px;
    text-align:center;
    color:#ff9800;
}

</style>
</head>

<body>

<header class="header">

<div class="header-top">

<div class="logo-title">
YASHWIN APP STORE
</div>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

</div>

<div class="menu" id="menu">

<button onclick="goHome()">🏠 Home</button>

<button onclick="showAbout()">ℹ️ About</button>

</div>

</header>


<main class="container" id="home">

<h1>YASHWIN APP STORE</h1>

<div class="subtitle">
Discover, Download and Enjoy Apps
</div>


<div class="search">

<input id="searchBox"
placeholder="Search apps..."
onkeyup="searchApps()">

<button>🔍</button>

</div>


<h2 class="section-title">📱 Apps</h2>


<div class="coming">

<h2>🚀 More Apps Coming Soon</h2>

<p>
New apps will be added to YASHWIN APP STORE.
</p>

</div>

</main>


<script>

function toggleMenu(){

    const menu=document.getElementById("menu");

    if(menu.style.display==="block"){
        menu.style.display="none";
    }else{
        menu.style.display="block";
    }

}

function goHome(){

    document.getElementById("home")
    .scrollIntoView();

    document.getElementById("menu")
    .style.display="none";

}

function showAbout(){

    alert(
      "YASHWIN APP STORE\n\n" +
      "Discover, Download and Enjoy Apps.\n\n" +
      "VANSH CALCULATOR v1.0"
    );

}

function searchApps(){

    let text=document
      .getElementById("searchBox")
      .value
      .toLowerCase();

    let calculator=
      document.getElementById("calculator");

    if(text==="" ||
       "vansh calculator calculator"
       .includes(text)){

        calculator.style.display="block";

    }else{

        calculator.style.display="none";

    }

}

</script>

</body>
</html>
