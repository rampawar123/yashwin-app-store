<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VANSH CALCULATOR</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 100%;
    max-width: 620px;
    margin: auto;
}

/* TITLE */
h1 {
    text-align: center;
    color: #ff9800;
    font-size: 36px;
    margin: 20px 0 30px;
}

/* DISPLAY */
.display {
    width: 100%;
    min-height: 145px;
    background: #222;
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 25px;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;

    overflow: hidden;
}

.expression {
    width: 100%;
    min-height: 35px;
    color: #aaa;
    font-size: 24px;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
}

.result {
    width: 100%;
    color: white;
    font-size: 55px;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
}

/* BUTTON GRID */
.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}

/* BUTTON */
button {
    border: none;
    border-radius: 22px;
    min-height: 80px;
    font-size: 28px;
    font-weight: bold;
    color: white;
    background: #303030;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

/* OPERATORS */
.operator {
    background: #ff9800;
}

.equal {
    background: #ff9800;
    grid-column: span 2;
}

.clear {
    background: #d62828;
}

.zero {
    grid-column: span 2;
}

/* HISTORY */
.history-title {
    margin-top: 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-title h2 {
    color: #ff9800;
    font-size: 30px;
}

.clear-history {
    min-height: 55px;
    padding: 0 22px;
    font-size: 18px;
    background: #333;
}

#history {
    margin-top: 10px;
}

.history-item {
    background: #222;
    padding: 15px 18px;
    margin-bottom: 10px;
    border-radius: 15px;
    font-size: 20px;
}

@media (max-width: 450px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 32px;
    }

    .display {
        min-height: 125px;
        padding: 20px;
    }

    .result {
        font-size: 48px;
    }

    .expression {
        font-size: 20px;
    }

    .buttons {
        gap: 12px;
    }

    button {
        min-height: 72px;
        font-size: 25px;
        border-radius: 18px;
    }
}
</style>
</head>

<body>

<div class="calculator">

    <!-- LOGO HATA DIYA GAYA HAI -->

    <h1>VANSH CALCULATOR</h1>

    <!-- DISPLAY -->
    <div class="display">

        <div id="expression" class="expression"></div>

        <div id="result" class="result">0</div>

    </div>


    <!-- BUTTONS -->
    <div class="buttons">

        <button class="clear" onclick="clearAll()">AC</button>

        <button onclick="backspace()">⌫</button>

        <button onclick="percent()">%</button>

        <button class="operator" onclick="operator('/')">÷</button>


        <button onclick="number('7')">7</button>
        <button onclick="number('8')">8</button>
        <button onclick="number('9')">9</button>
        <button class="operator" onclick="operator('*')">×</button>


        <button onclick="number('4')">4</button>
        <button onclick="number('5')">5</button>
        <button onclick="number('6')">6</button>
        <button class="operator" onclick="operator('-')">−</button>


        <button onclick="number('1')">1</button>
        <button onclick="number('2')">2</button>
        <button onclick="number('3')">3</button>
        <button class="operator" onclick="operator('+')">+</button>


        <button class="zero" onclick="number('0')">0</button>

        <button onclick="decimal()">.</button>


        <button class="equal" onclick="calculate()">=</button>

    </div>


    <!-- HISTORY -->
    <div class="history-title">

        <h2>History</h2>

        <button class="clear-history" onclick="clearHistory()">
            CLEAR
        </button>

    </div>

    <div id="history"></div>

</div>


<script>

let current = "0";
let previous = "";
let currentOperator = "";
let shouldReset = false;


/* DISPLAY UPDATE */
function updateDisplay() {

    document.getElementById("result").textContent = current;

    let expression = "";

    if (previous !== "" && currentOperator !== "") {

        expression =
            formatNumber(previous) +
            " " +
            displayOperator(currentOperator);

        if (!shouldReset) {
            expression += " " + formatNumber(current);
        }
    }

    document.getElementById("expression").textContent = expression;
}


/* NUMBER */
function number(value) {

    if (shouldReset) {

        current = value;
        shouldReset = false;

    } else {

        if (current === "0") {
            current = value;
        } else {
            current += value;
        }
    }

    updateDisplay();
}


/* DECIMAL */
function decimal() {

    if (shouldReset) {

        current = "0.";
        shouldReset = false;

    } else if (!current.includes(".")) {

        current += ".";

    }

    updateDisplay();
}


/* OPERATOR */
function operator(op) {

    if (currentOperator !== "" && !shouldReset) {
        calculate();
    }

    previous = current;
    currentOperator = op;
    shouldReset = true;

    updateDisplay();
}


/* CALCULATE */
function calculate() {

    if (previous === "" || currentOperator === "") {
        return;
    }

    let a = parseFloat(previous);
    let b = parseFloat(current);

    let answer;

    switch (currentOperator) {

        case "+":
            answer = a + b;
            break;

        case "-":
            answer = a - b;
            break;

        case "*":
            answer = a * b;
            break;

        case "/":

            if (b === 0) {

                current = "Error";
                previous = "";
                currentOperator = "";
                updateDisplay();

                return;
            }

            answer = a / b;
            break;
    }

    let expression =
        formatNumber(a) +
        " " +
        displayOperator(currentOperator) +
        " " +
        formatNumber(b);

    current = cleanNumber(answer);

    addHistory(expression, current);

    previous = "";
    currentOperator = "";
    shouldReset = true;

    updateDisplay();
}


/* PERCENT */
function percent() {

    let value = parseFloat(current);

    if (isNaN(value)) {
        return;
    }

    current = cleanNumber(value / 100);

    updateDisplay();
}


/* BACKSPACE */
function backspace() {

    if (shouldReset) {
        return;
    }

    if (current.length <= 1) {

        current = "0";

    } else {

        current = current.slice(0, -1);
    }

    updateDisplay();
}


/* AC */
function clearAll() {

    current = "0";
    previous = "";
    currentOperator = "";
    shouldReset = false;

    updateDisplay();
}


/* HISTORY */
function addHistory(expression, answer) {

    let history = document.getElementById("history");

    let item = document.createElement("div");

    item.className = "history-item";

    item.textContent =
        expression + " = " + answer;

    history.prepend(item);
}


/* CLEAR HISTORY */
function clearHistory() {

    document.getElementById("history").innerHTML = "";
}


/* OPERATOR DISPLAY */
function displayOperator(op) {

    if (op === "*") return "×";
    if (op === "/") return "÷";
    if (op === "-") return "−";

    return op;
}


/* NUMBER FORMAT */
function formatNumber(value) {

    let num = Number(value);

    if (!Number.isFinite(num)) {
        return value;
    }

    return cleanNumber(num);
}


/* CLEAN NUMBER */
function cleanNumber(value) {

    if (!Number.isFinite(value)) {
        return "Error";
    }

    if (Number.isInteger(value)) {
        return String(value);
    }

    return String(
        parseFloat(value.toFixed(10))
    );
}


/* KEYBOARD SUPPORT */
document.addEventListener("keydown", function(event) {

    let key = event.key;

    if (key >= "0" && key <= "9") {
        number(key);
    }

    else if (key === ".") {
        decimal();
    }

    else if (
        key === "+" ||
        key === "-" ||
        key === "*" ||
        key === "/"
    ) {
        operator(key);
    }

    else if (key === "Enter" || key === "=") {
        calculate();
    }

    else if (key === "Backspace") {
        backspace();
    }

    else if (key === "Escape") {
        clearAll();
    }

    else if (key === "%") {
        percent();
    }

});


// START
updateDisplay();

</script>

</body>
</html>
