<title>YASHWIN APP STORE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0d0d0d;
  color:#fff;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#171717;
  border-bottom:2px solid #ff9800;
}

.header-top{
  max-width:1100px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#ff9800;
  font-size:25px;
  font-weight:bold;
}

.menu-btn{
  background:#ff9800;
  color:#111;
  border:0;
  border-radius:12px;
  font-size:28px;
  padding:8px 14px;
  cursor:pointer;
}

.menu{
  display:none;
  background:#222;
  padding:12px 20px 18px;
}

.menu button{
  width:100%;
  margin-top:8px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#ff9800;
  color:#111;
  font-size:16px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:35px 18px;
}

.hero{
  text-align:center;
  padding:20px 0 30px;
}
