<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YASHWIN APP STORE</title>

<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101010;
  color:white;
}

header{
  text-align:center;
  padding:30px 15px;
  background:#202020;
}

header h1{
  margin:0;
  color:#ff9800;
  font-size:32px;
}

header p{
  color:#ddd;
  font-size:18px;
  margin:15px 0 0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:25px 15px;
}

.app-card{
  background:#242424;
  border-radius:25px;
  padding:20px;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.app-logo{
  width:90px;
  height:90px;
  border-radius:20px;
  background:#111;
  border:3px solid #ff9800;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#ff9800;
  font-weight:bold;
  font-size:15px;
  flex-shrink:0;
}

.app-info{
  flex:1;
}

.app-info h2{
  margin:0 0 8px;
  color:#ff9800;
  font-size:23px;
}

.app-info p{
  margin:0 0 15px;
  color:#ddd;
}

.button{
  display:inline-block;
  padding:13px 24px;
  background:#ff9800;
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
}

.button:active{
  transform:scale(.97);
}

footer{
  text-align:center;
  color:#777;
  padding:35px 10px;
  font-size:16px;
}

@media(max-width:500px){
  header h1{
    font-size:28px;
  }

  .app-card{
    padding:16px;
    gap:15px;
  }

  .app-logo{
    width:78px;
    height:78px;
    font-size:12px;
  }

  .app-info h2{
    font-size:20px;
  }

  .app-info p{
    font-size:14px;
  }

  .button{
    padding:12px 20px;
  }
}
</style>
</head>

<body>

<header>
  <h1>YASHWIN APP STORE</h1>
  <p>Discover, Download and Enjoy Apps</p>
</header>

<div class="container">

  <div class="app-card">

    <div class="app-logo">
      VANSH<br>
      CALCULATOR
    </div>

    <div class="app-info">
      <h2>VANSH CALCULATOR</h2>
      <p>Fast and simple calculator app.</p>

      <a class="button" href="calculator.html">
        OPEN APP
      </a>
    </div>

  </div>

</div>

<footer>
  © 2026 YASHWIN APP STORE
</footer>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js");
  });
}
</script>

</body>
</html>
