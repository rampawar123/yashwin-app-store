<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>YASHWIN APP STORE</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
 margin:0;
 background:#111;
 color:#fff;
 font-family:Arial,sans-serif;
}

button{
 font:inherit;
 cursor:pointer;
}

.header{
 background:#181818;
 border-bottom:2px solid #292929;
 padding:28px 34px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 position:sticky;
 top:0;
 z-index:20;
}

.logo{
 color:#ff9800;
 font-size:38px;
 font-weight:900;
}

.menuBtn{
 width:80px;
 height:76px;
 border:0;
 border-radius:20px;
 background:#ff9800;
 color:#111;
 font-size:42px;
 font-weight:bold;
}

.menu{
 display:none;
 background:#222;
 padding:18px 34px 24px;
 border-bottom:2px solid #ff9800;
}

.menu.show{
 display:block;
}

.menu button{
 width:100%;
 margin:7px 0;
 padding:17px;
 border:0;
 border-radius:15px;
 background:#ff9800;
 color:#111;
 font-weight:900;
 font-size:20px;
}

main{
 max-width:900px;
 margin:auto;
 padding:28px 34px 60px;
}

.topButtons{
 display:grid;
 grid-template-columns:1fr;
 gap:16px;
 margin-bottom:28px;
}

.topButtons button{
 border:0;
 border-radius:18px;
 padding:22px;
 background:#ff9800;
 color:#111;
 font-size:26px;
 font-weight:900;
}

.card{
 background:#1d1d1d;
 border:1px solid #383838;
 border-radius:28px;
 padding:34px;
 margin:28px 0;
 text-align:center;
 box-shadow:0 8px 25px #0008;
}

.appLogo{
 width:155px;
 height:155px;
 object-fit:contain;
 border-radius:30px;
 background:#000;
 margin:auto;
 display:block;
}

.card h2{
 font-size:34px;
 margin:28px 0 12px;
}

.card p{
 color:#aaa;
 font-size:23px;
 margin:0 0 28px;
}

.actions{
 display:grid;
 grid-template-columns:1fr;
 gap:14px;
}

.actionBtn{
 width:100%;
 border:0;
 border-radius:17px;
 padding:20px;
 background:#ff9800;
 color:#111;
 font-size:25px;
 font-weight:900;
}

.actionBtn:active{
 transform:scale(.98);
}

.about{
 display:none;
}

.about.show{
 display:block;
}

.footer{
 text-align:center;
 color:#888;
 padding:25px;
 font-size:15px;
}

.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 background:#ff9800;
 color:#111;
 padding:15px 22px;
 border-radius:13px;
 font-weight:900;
 display:none;
 z-index:100;
}

@media(max-width:600px){

 .header{
  padding:22px 34px;
 }

 .logo{
  font-size:30px;
 }

 .menuBtn{
  width:78px;
  height:76px;
 }

 main{
  padding:28px 34px 50px;
 }

 .card{
  padding:28px 20px;
 }

 .card h2{
  font-size:30px;
 }

 .card p{
  font-size:22px;
 }

 .actionBtn{
  font-size:23px;
 }
}
</style>
</head>

<body>

<header class="header">

 <div class="logo">
  YASHWIN APP STORE
 </div>

 <button class="menuBtn" onclick="toggleMenu()">
  ☰
 </button>

</header>

<div id="menu" class="menu">

 <button onclick="goApps()">📱 Apps</button>

 <button onclick="goAbout()">ℹ️ About</button>

 <button onclick="shareStore()">🔗 Share YASHWIN APP STORE</button>

</div>

<main id="apps">

 <div class="topButtons">

  <button onclick="goApps()">
   Apps
  </button>

  <button onclick="goAbout()">
   About
  </button>

 </div>


 <!-- VANSH CALCULATOR -->

 <section class="card">

  <img
   class="appLogo"
   src="calculator-logo.png"
   alt="VANSH CALCULATOR"
   onerror="this.style.display='none'"
  >

  <h2>
   VANSH CALCULATOR
  </h2>

  <p>
   Simple and fast calculator.
  </p>

  <div class="actions">

   <button
    class="actionBtn"
    onclick="downloadCalculator()">
    Download APK
   </button>

   <button
    class="actionBtn"
    onclick="openCalculator()">
    Open App
   </button>

   <button
    class="actionBtn"
    onclick="shareCalculator()">
    🔗 Share App
   </button>

  </div>

 </section>


 <!-- YASHWIN APP STORE -->

 <section class="card">

  <img
   class="appLogo"
   src="yashwin-app-store-logo.png"
   alt="YASHWIN APP STORE"
   onerror="this.style.display='none'"
  >

  <h2>
   YASHWIN APP STORE
  </h2>

  <p>
   Your personal app store.
  </p>

  <div class="actions">

   <button
    class="actionBtn"
    onclick="downloadStore()">
    Download APK
   </button>

   <button
    class="actionBtn"
    onclick="openStore()">
    Open App
   </button>

   <button
    class="actionBtn"
    onclick="shareStore()">
    🔗 Share App Store
   </button>

  </div>

 </section>


 <!-- ABOUT -->

 <section id="about" class="card about">

  <h2>
   ℹ️ About YASHWIN APP STORE
  </h2>

  <p>
   YASHWIN APP STORE is our personal application platform.
  </p>

  <p>
   Here you can find and open our applications.
  </p>

  <p>
   Version: 1.0.0
  </p>

 </section>

</main>


<div id="toast" class="toast"></div>


<footer class="footer">
 YASHWIN APP STORE © 2026
</footer>


<script>

const STORE_URL =
 "https://rampawar123.github.io/yashwin-app-store/";

const CALCULATOR_URL =
 "https://rampawar123.github.io/yashwin-app-store/calculator.html";


/*
 IMPORTANT:
 APK file ka exact naam/path tumhare repository
 me jo hai uske hisab se yaha set karna hai.
*/

const CALCULATOR_APK =
 "calculator.apk";

const STORE_APK =
 "yashwin-app-store.apk";


function toggleMenu(){

 const menu =
 document.getElementById("menu");

 menu.classList.toggle("show");

}


function goApps(){

 document.getElementById("apps")
 .scrollIntoView({
  behavior:"smooth"
 });

 document.getElementById("about")
 .classList.remove("show");

 document.getElementById("menu")
 .classList.remove("show");

}


function goAbout(){

 const about =
 document.getElementById("about");

 about.classList.add("show");

 about.scrollIntoView({
  behavior:"smooth"
 });

 document.getElementById("menu")
 .classList.remove("show");

}


function openCalculator(){

 window.location.href =
 CALCULATOR_URL;

}


function downloadCalculator(){

 window.location.href =
 CALCULATOR_APK;

}


function openStore(){

 window.location.href =
 STORE_URL;

}


function downloadStore(){

 window.location.href =
 STORE_APK;

}


async function shareLink(url,text){

 if(navigator.share){

  try{

   await navigator.share({
    title:"YASHWIN APP STORE",
    text:text,
    url:url
   });

  }catch(e){}

 }else{

  try{

   await navigator.clipboard.writeText(url);

   showToast(
    "🔗 Link copied"
   );

  }catch(e){

   prompt(
    "Share this link:",
    url
   );

  }

 }

}


function shareCalculator(){

 shareLink(
  CALCULATOR_URL,
  "VANSH CALCULATOR"
 );

}


function shareStore(){

 shareLink(
  STORE_URL,
  "YASHWIN APP STORE"
 );

}


function showToast(message){

 const toast =
 document.getElementById("toast");

 toast.innerText =
 message;

 toast.style.display =
 "block";

 setTimeout(function(){

  toast.style.display =
  "none";

 },2000);

}

</script>

</body>
</html>
