<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YASHWIN APP STORE</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#101010;
  color:#fff;
}

header{
  background:#181818;
  border-bottom:3px solid #ff9800;
  position:sticky;
  top:0;
  z-index:100;
}

.header{
  max-width:1100px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#ff9800;
  font-size:25px;
  font-weight:bold;
}

.menu-btn{
  background:#ff9800;
  color:#111;
  border:0;
  border-radius:12px;
  font-size:28px;
  padding:8px 14px;
  cursor:pointer;
}

nav{
  display:none;
  background:#222;
  padding:12px 20px;
}

nav.show{
  display:block;
}

nav button{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:0;
  border-radius:10px;
  background:#ff9800;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.hero{
  text-align:center;
}

.hero h1{
  color:#ff9800;
  font-size:42px;
  margin-bottom:15px;
}

.hero p{
  color:#ccc;
  font-size:19px;
}

.search{
  display:flex;
  margin:35px auto;
  max-width:700px;
}

.search input{
  flex:1;
  padding:16px;
  border:1px solid #555;
  border-radius:14px 0 0 14px;
  background:#222;
  color:#fff;
  font-size:17px;
  outline:none;
}

.search button{
  width:70px;
  border:0;
  border-radius:0 14px 14px 0;
  background:#ff9800;
  font-size:24px;
  cursor:pointer;
}

.section-title{
  color:#ff9800;
  font-size:32px;
  margin:30px 0 20px;
}

.apps{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
