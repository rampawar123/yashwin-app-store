<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CRIC YUVA - Complete Next-Gen Cricket Super App</title>
<style>
  /* ==========================================================================
     1. CRIC YUVA MASTER CORE DESIGN (NEON DARK HIGHER-UTILITY GRID)
     ========================================================================== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
  :root {
    --bg-main: #050b14; --bg-surface: #0b1528; --bg-card: #112240;
    --neon-blue: #00f0ff; --neon-green: #39ff14; --neon-red: #ff1744; --neon-gold: #ffd700;
    --text-pure: #ffffff; --text-muted: #7e91b3; --border-line: rgba(0, 240, 255, 0.15);
  }
  body { min-height: 100vh; background: radial-gradient(circle at top, #0f2547 0%, var(--bg-main) 60%); color: var(--text-pure); overflow-x: hidden; padding-bottom: 75px; }
  
  /* CORE APPLICATION LAYOUT SHELLS */
  .view-shell { display: none; width: 100%; max-width: 540px; margin: 0 auto; padding: 15px; }
  .view-shell.active { display: block; animation: shellEntrance 0.25s ease-out; }
  @keyframes shellEntrance { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* SPLASH CONTROLLER GRID */
  #splashScreen { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: #030712; transition: opacity 0.4s ease; }
  .splashBlock { text-align: center; }
  .splashLogo { width: 95px; height: 95px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border-radius: 28px; font-size: 48px; background: linear-gradient(135deg, var(--neon-blue), #0066ff); box-shadow: 0 0 35px rgba(0, 240, 255, 0.4); }

  /* UNIVERSAL REUSABLE COMPONENT CARDS */
  .yuva-card { background: var(--bg-surface); border: 1px solid var(--border-line); border-radius: 20px; padding: 18px; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); position: relative; }
  .form-element { margin-bottom: 14px; text-align: left; }
  .form-element label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-element input, .form-element select { width: 100%; padding: 12px 14px; background: var(--bg-main); border: 1px solid var(--border-line); border-radius: 12px; color: var(--text-pure); font-size: 14px; outline: none; }
  .form-element input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
  
  /* NAVIGATION & BUTTON MATRIX FRAMEWORK */
  .master-cta { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--neon-blue), #0077ff); color: #000; border: none; border-radius: 14px; font-size: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3); transition: transform 0.1s; }
  .master-cta:active { transform: scale(0.97); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; color: var(--neon-blue); background: rgba(0, 240, 255, 0.08); font-size: 12px; font-weight: bold; border: none; margin-bottom: 12px; cursor: pointer; }
  
  /* APP TOPBAR CONFIG */
  .appHeader { position: sticky; top: 0; z-index: 1000; min-height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: rgba(5, 11, 20, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-line); }
  .headerIcons { display: flex; gap: 10px; }
  .iconBtn { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-surface); border: 1px solid var(--border-line); color: var(--text-pure); font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* BOTTOM NAVIGATION STRIP */
  .bottomDock { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #070d19; border-top: 1px solid var(--border-line); display: flex; justify-content: space-around; align-items: center; z-index: 9999; }
  .dockTab { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 10px; font-weight: bold; cursor: pointer; }
  .dockTab.active { color: var(--neon-blue); }
  .dockTab span { font-size: 20px; margin-bottom: 2px; }

  /* MATCH CONSOLE SPECIAL SUBTABS & GRIDS */
  .console-tabs { display: flex; gap: 5px; margin: 12px 0; background: var(--bg-main); padding: 4px; border-radius: 10px; }
  .subtab { flex: 1; text-align: center; padding: 8px; font-size: 11px; font-weight: bold; color: var(--text-muted); border-radius: 8px; cursor: pointer; }
  .subtab.active { background: var(--bg-card); color: var(--neon-blue); border: 1px solid rgba(0, 240, 255, 0.2); }
  
  /* BALL BY BALL INPUT CONTROL GRID */
  .padGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
  .padBtn { padding: 15px 5px; font-size: 18px; font-weight: 900; border-radius: 12px; border: 1px solid var(--border-line); background: var(--bg-card); color: white; cursor: pointer; position: relative; }
  .padBtn.active-run { background: rgba(0, 240, 255, 0.2); border-color: var(--neon-blue); color: var(--neon-blue); }
  .padBtn::after { content: ''; position: absolute; inset: 2px; border: 1px dashed transparent; border-radius: 10px; }
  .padBtn.active-run::after { border-color: var(--neon-blue); }
  .padBtn.fn-run { color: var(--neon-green); background: rgba(57, 255, 20, 0.08); }
  .padBtn.fn-ex { color: var(--neon-gold); background: rgba(255, 215, 0, 0.08); }
  .padBtn.fn-wk { color: var(--neon-red); background: rgba(255, 23, 68, 0.1); }
  
  /* WAGON WHEEL ENGINE DESIGN */
  .wheelContainer { position: relative; width: 180px; height: 180px; margin: 15px auto; border-radius: 50%; background: #1b4d22; border: 4px solid var(--text-pure); overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .wheelSlice { position: absolute; width: 50%; height: 50%; top: 0; left: 0; transform-origin: 100% 100%; border-right: 1px dashed rgba(255,255,255,0.2); border-bottom: 1px dashed rgba(255,255,255,0.2); cursor: pointer; }
  .wheelPitch { position: absolute; width: 22px; height: 45px; background: #d2b48c; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 2px; }
</style>
</head>
<body>

<!-- 0. MASTER SPLASH OVERLAY -->
<div id="splashScreen">
  <div class="splashBlock">
    <div class="splashLogo">🏏</div>
    <h2 style="letter-spacing: 2px; font-weight: 900;">CRIC YUVA</h2>
    <p style="font-size: 11px; color: var(--text-muted); margin-top: 5px; font-weight: bold; text-transform: uppercase;">Super App Scoring Matrix</p>
  </div>
</div>

<!-- ==========================================================================
     2. DYNAMIC APPLICATION WINDOW PAGES FRAMEWORK
     ========================================================================== -->

<!-- PAGE 1: AUTH GATEWAY (SIGNUP / LOGIN PANEL) -->
<section id="authPage" class="view-shell active">
  <div style="text-align: center; margin-bottom: 25px; margin-top: 40px;">
    <h1 style="color: var(--neon-blue); font-size: 34px; font-weight: 900;">CRIC YUVA</h1>
    <p style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">Advanced Cricket Management System</p>
  </div>
  
  <div class="yuva-card" id="authBox">
    <h3 style="margin-bottom: 15px; color: var(--neon-blue);">Secure Access Layer</h3>
    <div class="form-element"><label>Mobile Number</label><input type="number" id="authMobile" value="9876543210"></div>
    <div class="form-group form-element"><label>Password</label><input type="password" id="authPassword" value="123456"></div>
    <button class="master-cta" onclick="executeAppAuth()">Open Super Console 🚀</button>
    <button class="master-cta" style="background:#4b5563; margin-top:10px; color:#fff;" onclick="toggleAuthRegistrationView(true)">Register New Permanent Profile 🆕</button>
  </div>

  <div class="yuva-card" id="regBox" style="display:none;">
    <h3 style="margin-bottom: 15px; color: var(--neon-green);">Dynamic Roster Registration</h3>
    <div class="form-element"><label>Full Legal Name</label><input type="text" id="regName" placeholder="E.g. Virat Kohli"></div>
    <div class="form-element"><label>Jersey Display Name</label><input type="text" id="regJName" placeholder="VIRAT"></div>
    <div class="form-element"><label>Jersey Number</label><input type="number" id="regJNo" placeholder="18"></div>
    <div class="form-element"><label>Jersey Size</label><select id="regJSize"><option>M</option><option>L</option><option>XL</option><option>XXL</option></select></div>
    <div class="form-element"><label>Playing Core Role</label><select id="regRole"><option>Batsman</option><option>Bowler</option><option>All-Rounder</option><option>Wicket-Keeper</option></select></div>
    <div class="form-element"><label>Date of Birth</label><input type="date" id="regDob" value="1998-11-05"></div>
    <button class="master-cta" style="background:linear-gradient(135deg, var(--neon-green), #059669);" onclick="processRosterRegistration()">Save & Compile Player ID 💾</button>
    <button class="master-cta" style="background:#4b5563; margin-top:10px; color:#fff;" onclick="toggleAuthRegistrationView(false)">Return to Gateway Login</button>
  </div>
</section>

<!-- MASTER MAIN APPLICATION APP CONTENT VIEWS LAYOUT -->
<div id="superAppInterface" style="display: none;">
  
  <!-- APP HEADER STRIP -->
  <header class="customAppHeader appHeader">
    <div class="brand">
      <div class="logoBox">🏏</div>
    
      <\script>

      </body>
      </html>
