<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#071a2a">
<title>CRIC YUVA V4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#061522;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:#081a2a;border-bottom:1px solid #28455d;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:900}
.small{color:#9db0c1;font-size:14px}
nav{display:flex;gap:8px;overflow:auto;background:#081a2a;padding:10px;border-bottom:1px solid #28455d}
nav button{border:0;background:#102b43;color:#d8e4ed;border-radius:14px;padding:13px 20px;font-weight:800;white-space:nowrap}
nav button.active{background:#ffb51b;color:#111}
main{max-width:850px;margin:auto;padding:16px}
.card{background:#0b2439;border:1px solid #284b66;border-radius:22px;padding:18px;margin-bottom:15px}
.btn{border:0;border-radius:14px;padding:13px 17px;background:#ffb51b;color:#111;font-weight:900}
.btn.dark{background:#14334d;color:#fff}
.btn.blue{background:#2095ee;color:#fff}
.btn.red{background:#e54848;color:#fff}
.btn.green{background:#29a56a;color:#fff}
.btn.full{width:100%;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.detailGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.detail{background:#071b2c;border:1px solid #24455e;border-radius:12px;padding:12px}
.detail small{display:block;color:#94aabd;margin-bottom:5px}
.detail b{word-break:break-word}
label{display:block;margin:12px 0 6px;font-weight:800;color:#dce7ef}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #31526b;background:#061a2b;color:#fff;outline:none}
textarea{min-height:90px}
.overlay{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:10px}
.modal{width:100%;max-width:700px;max-height:94vh;overflow:auto;background:#0b2439;border:1px solid #31516c;border-radius:24px;padding:18px}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.icon{border:1px solid #31516c;background:#102c44;color:#fff;border-radius:14px;padding:12px 15px}
.list{padding:14px 0;border-bottom:1px solid #25455d}
.empty{text-align:center;color:#9db0c1;padding:28px}
.profile{text-align:center}
.photo{width:190px;height:190px;border-radius:50%;border:6px solid #dbe2e8;background:#203b53;display:flex;align-items:center;justify-content:center;margin:10px auto 18px;overflow:hidden;color:#b9c7d2}
.photo img{width:100%;height:100%;object-fit:cover}
.jersey{border:1px solid #e6ad22;border-radius:22px;padding:18px;text-align:center;margin-top:18px}
.jerseyName{font-weight:900;color:#ffbd20;font-size:22px}
.jerseyNumber{font-size:74px;font-weight:900}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tag{background:#143653;border-radius:20px;padding:8px 12px}
.teamLogo{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#17344e;border:2px solid #54718a;display:flex;align-items:center;justify-content:center}
.teamHead{display:flex;align-items:center;gap:12px}
.playerRow{display:flex;gap:10px;align-items:center;background:#071b2c;border:1px solid #24455e;border-radius:14px;padding:10px;margin-top:8px}
.playerMini{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#203b53;display:flex;align-items:center;justify-content:center}
.playerMini img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.score{font-size:44px;font-weight:900;text-align:center}
.scoreButtons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scoreButtons button{padding:16px;border:0;border-radius:12px;background:#143b5c;color:#fff;font-weight:900}
.searchBox{margin-bottom:10px}
.notice{background:#102c44;border-left:4px solid #ffb51b;border-radius:10px;padding:12px;color:#dbe6ee}
@media(max-width:600px){
 .grid,.detailGrid{grid-template-columns:1fr}
 .logo{font-size:25px}
 main{padding:10px}
 .modal{padding:15px}
 .scoreButtons{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<section id="loginScreen" class="hidden">
<main>
<div class="card" style="max-width:500px;margin:60px auto">
<h1>🏏 CRIC YUVA</h1>
<p class="small">Professional Cricket Platform</p>
<label>Mobile Number</label><input id="loginMobile" type="tel">
<label>Password</label><input id="loginPassword" type="password">
<button class="btn full" onclick="login()">Login</button>
<button class="btn blue full" onclick="registerAccount()">Create Player Account</button>
<button class="btn dark full" onclick="forgotPassword()">Forgot Password?</button>
</div>
</main>
</section>

<section id="app" class="hidden">
<header>
<div><div class="logo">🏏 CRIC YUVA</div><div class="small">Professional Cricket Platform</div></div>
<button class="icon" onclick="openSettings()">⚙️</button>
</header>

<nav>
<button id="navProfile" onclick="page('profile')">Profile</button>
<button id="navMatches" onclick="page('matches')">Matches</button>
<button id="navPlayers" onclick="page('players')">Players</button>
<button id="navFriends" onclick="page('friends')">Friends</button>
<button id="navChat" onclick="page('chat')">Chat</button>
<button onclick="logout()">Logout</button>
</nav>

<main>
<section id="profilePage" class="page">
<div id="profileView"></div>
</section>

<section id="matchesPage" class="page hidden">
<div class="card">
<h2>🏏 Match & Competition Center</h2>
<div class="grid">
<button class="btn" onclick="createTournament()">🏆 Create Tournament</button>
<button class="btn blue" onclick="createTeam()">➕ Add Team</button>
<button class="btn dark" onclick="createSingleMatch()">🏏 Single Match</button>
<button class="btn green" onclick="createSeries()">📚 Create Series</button>
</div>
</div>
<div id="competitionList"></div>
</section>

<section id="playersPage" class="page hidden">
<div class="card">
<h2>👥 Player Registry</h2>
<p class="small">Players created on this device can be searched by Mobile, Player ID or Name and added to teams.</p>
<button class="btn" onclick="newRegistryPlayer()">➕ Add / Register Player</button>
<div id="playerRegistry" style="margin-top:12px"></div>
</div>
</section>

<section id="friendsPage" class="page hidden">
<div class="card"><h2>👥 Friends</h2><div id="friendsList"></div></div>
</section>

<section id="chatPage" class="page hidden">
<div class="card"><h2>💬 Chat</h2><div id="chatMessages"></div>
<div class="grid"><input id="chatInput" placeholder="Message..."><button class="btn" onclick="sendChat()">Send</button></div></div>
</section>
</main>
</section>

<div id="modal" class="overlay hidden">
<div class="modal">
<div class="modalHead"><h2 id="modalTitle">Details</h2><button class="icon" onclick="closeModal()">✕</button></div>
<div id="modalBody"></div>
</div>
</div>

<script>
const K={
 account:"CY_ACCOUNT_V3",profile:"CY_PROFILE_V3",players:"CY_PLAYERS_V3",
 teams:"CY_TEAMS_V3",tournaments:"CY_TOURNAMENTS_V3",
 matches:"CY_MATCHES_V3",series:"CY_SERIES_V3",friends:"CY_FRIENDS_V3",
 chats:"CY_CHAT_V3",live:"CY_LIVE_V3"
};
let account=load(K.account,null);
let profile=load(K.profile,null);
function subscriptionInfo(acc){
  if(!acc) return {active:false,days:0};
  const start=Number(acc.freeStarted||Date.now());
  const days=Math.max(0,Math.ceil((start+183*86400000-Date.now())/86400000));
  return {active:days>0,days};
}

let players=load(K.players,[]);
let teams=load(K.teams,[]);
let tournaments=load(K.tournaments,[]);
let matches=load(K.matches,[]);
let series=load(K.series,[]);
let friends=load(K.friends,[]);
let chats=load(K.chats,[]);
let live=load(K.live,null);
let selectedPlayers=[];
let selectedTournamentId=null;

function load(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
function saveAll(){
Object.entries({[K.account]:account,[K.profile]:profile,[K.players]:players,[K.teams]:teams,[K.tournaments]:tournaments,[K.matches]:matches,[K.series]:series,[K.friends]:friends,[K.chats]:chats,[K.live]:live}).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));
}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function id(prefix){return prefix+"-"+Date.now()+"-"+Math.floor(Math.random()*999)}
function openModal(title,body){document.getElementById("modalTitle").innerHTML=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function detail(a,b){return `<div class="detail"><small>${esc(a)}</small><b>${esc(b||"—")}</b></div>`}
function opt(v,c){return `<option ${v===c?"selected":""}>${esc(v)}</option>`}
function img(src,cls="teamLogo"){return src?`<img class="${cls}" src="${src}">`:`<div class="${cls}">🏏</div>`}

window.onload=()=>{
 if(account&&profile){showApp();page("profile")}
 else if(account){showApp();editProfile()}
 else showLogin()
}

function showLogin(){loginScreen.classList.remove("hidden");app.classList.add("hidden")}
function showApp(){loginScreen.classList.add("hidden");app.classList.remove("hidden");renderProfile()}
function registerAccount(){
 const mobile=prompt("Mobile Number डालें:");
 if(!mobile)return;
 const password=prompt("Password बनाएं:");
 if(!password)return;
 account={mobile:mobile,password:password,freeStarted:Date.now(),subscription:"6_MONTH_FREE"};
 profile=null;
 if(!players.some(p=>p.mobile===mobile)) players.push({id:id("CY"),mobile,name:"",profilePending:true});
 saveAll();showApp();setTimeout(editProfile,200)
}
function login(){
 if(!account){alert("पहले Create Player Account करें.");return}
 if(loginMobile.value.trim()!==account.mobile||loginPassword.value!==account.password){alert("Mobile या Password गलत है.");return}
 showApp()
}
function forgotPassword(){
 if(!account){alert("Account नहीं है.");return}
 const m=prompt("Registered mobile:");
 if(m!==account.mobile){alert("Mobile नहीं मिला.");return}
 const p=prompt("New password:");
 if(!p)return;
 account.password=p;
 saveAll();
 alert("✅ Password reset हो गया. अब इसी mobile number और नए password से फिर Login करें.");
 loginMobile.value=account.mobile;
 loginPassword.value="";
 loginScreen.classList.remove("hidden");
 app.classList.add("hidden");
}
function logout(){account=load(K.account,null);profile=load(K.profile,null);showLogin()}

function page(p){
 document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
 ["Profile","Matches","Players","Friends","Chat"].forEach(x=>document.getElementById("nav"+x).classList.remove("active"));
 const map={profile:["profilePage","navProfile"],matches:["matchesPage","navMatches"],players:["playersPage","navPlayers"],friends:["friendsPage","navFriends"],chat:["chatPage","navChat"]};
 document.getElementById(map[p][0]).classList.remove("hidden");document.getElementById(map[p][1]).classList.add("active");
 if(p==="profile")renderProfile();if(p==="matches")renderCompetitions();if(p==="players")renderPlayers();if(p==="friends")renderFriends();if(p==="chat")renderChat()
}

function editProfile(existing){
 const p=existing||profile||{};
 openModal("👤 Player Profile",`
 <label>Full Name *</label><input id="fName" value="${esc(p.name||"")}" placeholder="Player Name">
 <label>Date of Birth</label><input id="fDob" type="date" value="${esc(p.dob||"")}">
 <label>Email</label><input id="fEmail" value="${esc(p.email||"")}" placeholder="Email">
 <label>Team</label><input id="fTeam" value="${esc(p.team||"")}">
 <label>Playing Role</label><select id="fRole">${opt("Batsman",p.role)}${opt("Bowler",p.role)}${opt("All Rounder",p.role)}${opt("Wicket Keeper Batsman",p.role)}</select>
 <label>Batting</label><select id="fBat">${opt("Right Hand",p.batting)}${opt("Left Hand",p.batting)}</select>
 <label>Bowling</label><select id="fBowl">${opt("Right Arm Fast",p.bowling)}${opt("Right Arm Medium",p.bowling)}${opt("Right Arm Spin",p.bowling)}${opt("Left Arm Fast",p.bowling)}${opt("Left Arm Medium",p.bowling)}${opt("Left Arm Spin",p.bowling)}${opt("Not Applicable",p.bowling)}</select>
 <label>Jersey Name</label><input id="fJerseyName" value="${esc(p.jerseyName||"")}">
 <label>Jersey Number</label><input id="fJerseyNumber" type="number" value="${esc(p.jerseyNumber||"")}">
 <label>Jersey Size</label><select id="fSize">${["S","M","L","XL","XXL","XXXL"].map(x=>opt(x,p.jerseySize)).join("")}</select>
 <label>Pant Size</label><input id="fPantSize" value="${esc(p.pantSize||"")}" placeholder="Pant Size">
 <label>City</label><input id="fCity" value="${esc(p.city||"")}">
 <label>Player Photo</label><input id="fPhoto" type="file" accept="image/*">
 <button class="btn full" onclick="saveProfile(${existing?`'${existing.id}'`:"null"})">💾 Save Profile</button>`)
}
function saveProfile(existingId){
 const name=fName.value.trim();if(!name){alert("Player Name जरूरी है.");return}
 const old=existingId?players.find(p=>p.id===existingId):(profile||{});
 const finish=photo=>{
  const obj={...old,id:old.id||id("CY"),name,dob:fDob.value,email:fEmail.value,team:fTeam.value,role:fRole.value,batting:fBat.value,bowling:fBowl.value,jerseyName:fJerseyName.value,jerseyNumber:fJerseyNumber.value||"00",jerseySize:fSize.value,pantSize:fPantSize.value,city:fCity.value,photo:photo||old.photo||"",mobile:old.mobile||account.mobile,stats:old.stats||{matches:0,runs:0,wickets:0,fours:0,sixes:0,catches:0}};
  if(existingId){const i=players.findIndex(x=>x.id===existingId);players[i]=obj}else{profile=obj;const i=players.findIndex(x=>x.mobile===account.mobile);if(i>=0)players[i]=obj;else players.push(obj)}
  saveAll();closeModal();renderProfile();renderPlayers()
 };
 const file=fPhoto.files[0];if(file){const r=new FileReader();r.onload=e=>finish(e.target.result);r.readAsDataURL(file)}else finish(old.photo||"")
}
function renderProfile(){
 if(!profile){profileView.innerHTML=`<div class="card"><h2>👤 Player Profile</h2><button class="btn" onclick="editProfile()">Create Profile</button></div>`;return}
 profileView.innerHTML=`<div class="card profile">
 <div class="photo">${profile.photo?`<img src="${profile.photo}">`:"Player Photo"}</div>
 <h1>${esc(profile.name)} ✓</h1><div class="small">🆔 ${esc(profile.id)} • 📱 ${esc(profile.mobile||account.mobile)}</div>
 <div class="tags"><span class="tag">${esc(profile.role)}</span><span class="tag">${esc(profile.batting)}</span><span class="tag">${esc(profile.bowling)}</span></div>
 <div class="actions" style="justify-content:center"><button class="btn" onclick="editProfile()">✏️ Edit Profile</button><button class="btn dark" onclick="fullPlayerDetails(profile)">📋 Full Details</button></div>
 <div class="subscription">🎁 <b>${subscriptionInfo(account).active?"6 Months FREE Active":"Free Period Expired"}</b> ${subscriptionInfo(account).active?`• ${subscriptionInfo(account).days} days remaining`:""}</div>
 <div class="jersey"><div class="jerseyName">${esc((profile.jerseyName||"PLAYER").toUpperCase())}</div><div class="jerseyNumber">${esc(profile.jerseyNumber||"00")}</div><div class="small">Jersey Size: ${esc(profile.jerseySize||"M")} • Pant Size: ${esc(profile.pantSize||"—")}</div></div>
 </div>`
}
function fullPlayerDetails(p){openModal("📋 Player Full Details",`<div class="detailGrid">${detail("Player ID",p.id)}${detail("Full Name",p.name)}${detail("Mobile",p.mobile)}${detail("Email",p.email)}${detail("Date of Birth",p.dob)}${detail("Team",p.team)}${detail("Playing Role",p.role)}${detail("Batting",p.batting)}${detail("Bowling",p.bowling)}${detail("Jersey Name",p.jerseyName)}${detail("Jersey Number",p.jerseyNumber)}${detail("Jersey Size",p.jerseySize)}${detail("Pant Size",p.pantSize)}${detail("City",p.city)}</div>`)}
function newRegistryPlayer(){const p={id:id("CY"),mobile:"",name:"",role:"Batsman",batting:"Right Hand",bowling:"Not Applicable",jerseySize:"M",pantSize:""};players.push(p);saveAll();editProfile(p)}

function renderPlayers(){
 if(!players.length){playerRegistry.innerHTML='<div class="empty">No registered players.</div>';return}
 playerRegistry.innerHTML=players.map(p=>`<div class="playerRow">${p.photo?`<img class="playerMini" src="${p.photo}">`:`<div class="playerMini">🏏</div>`}<div style="flex:1"><b>${esc(p.name||"Unnamed Player")}</b><div class="small">ID: ${esc(p.id)} • Mobile: ${esc(p.mobile)}</div></div><button class="btn dark" onclick="fullPlayerDetails(players.find(x=>x.id==='${p.id}'))">Details</button><button class="btn" onclick="editProfile(players.find(x=>x.id==='${p.id}'))">Edit</button></div>`).join("")
}

function createTeam(){
 selectedPlayers=[];
 openModal("🏏 Create Team",`
 <label>Team Name *</label><input id="teamName" placeholder="Team Name">
 <label>Team Logo</label><input id="teamLogo" type="file" accept="image/*">
 <div class="card"><h3>👥 Players — Maximum 15</h3>
 <input id="teamPlayerSearch" class="searchBox" placeholder="Mobile / Player ID / Name" oninput="searchTeamPlayers()">
 <div id="teamPlayerResults"></div><div id="selectedTeamPlayers"></div></div>
 <div class="card"><h3>🧑‍💼 Support Team — Maximum 5</h3>
 <input id="support1" placeholder="Coach"><input id="support2" placeholder="Manager"><input id="support3" placeholder="Assistant Coach"><input id="support4" placeholder="Trainer"><input id="support5" placeholder="Team Member">
 </div><button class="btn full" onclick="saveTeam()">💾 Save Team</button>`)
}
function searchTeamPlayers(){
 const q=teamPlayerSearch.value.trim().toLowerCase();
 if(!q){teamPlayerResults.innerHTML="";return}
 const found=players.filter(p=>String(p.id).toLowerCase().includes(q)||String(p.name||"").toLowerCase().includes(q)||String(p.mobile||"").toLowerCase().includes(q));
 teamPlayerResults.innerHTML=found.length?found.map(p=>`<div class="playerRow"><div style="flex:1"><b>${esc(p.name||"Unnamed")}</b><div class="small">${esc(p.id)} • ${esc(p.mobile)}</div></div><button class="btn" onclick="selectTeamPlayer('${p.id}')">➕ Add</button></div>`).join(""):'<div class="empty">Player नहीं मिला.</div>'
}
function selectTeamPlayer(pid){
 const p=players.find(x=>x.id===pid);if(!p)return;if(selectedPlayers.some(x=>x.id===pid)){alert("Player already added.");return}if(selectedPlayers.length>=15){alert("Maximum 15 players.");return}selectedPlayers.push({...p});renderSelectedTeamPlayers()
}
function renderSelectedTeamPlayers(){selectedTeamPlayers.innerHTML=selectedPlayers.length?selectedPlayers.map((p,i)=>`<div class="list"><b>${i+1}. ${esc(p.name)}</b><div class="small">${esc(p.id)} • ${esc(p.role)}</div><button class="btn red" onclick="selectedPlayers.splice(${i},1);renderSelectedTeamPlayers()">Remove</button></div>`).join(""):'<div class="empty">No players added.</div>'}
function saveTeam(){
 const name=teamName.value.trim();if(!name){alert("Team Name जरूरी है.");return}
 const support=[support1.value,support2.value,support3.value,support4.value,support5.value].map(x=>x.trim()).filter(Boolean);if(selectedPlayers.length>15||support.length>5)return
 const team={id:id("TEAM"),name,logo:"",players:[...selectedPlayers],support,created:new Date().toLocaleDateString()};
 const f=teamLogo.files[0];const done=src=>{team.logo=src||"";teams.push(team);saveAll();closeModal();renderCompetitions();alert("✅ Team created.")};if(f){const r=new FileReader();r.onload=e=>done(e.target.result);r.readAsDataURL(f)}else done("")
}

function createTournament(){
 openModal("🏆 Create Tournament",`
 <label>Tournament Name *</label><input id="tourName" placeholder="Tournament Name">
 <label>Date</label><input id="tourDate" type="date">
 <label>Location / City</label><input id="tourLocation" placeholder="Ground / City">
 <label>Number of Grounds</label><select id="tourGrounds">${[1,2,3,4].map(n=>`<option value="${n}">${n} Ground${n>1?"s":""}</option>`).join("")}</select>
 <div id="groundNames"></div>
 <button class="btn full" onclick="saveTournament()">🏆 Create Tournament</button>`)
 tourGrounds.onchange=renderGroundInputs;renderGroundInputs()
}
function renderGroundInputs(){const n=+tourGrounds.value;groundNames.innerHTML=Array.from({length:n},(_,i)=>`<label>Ground ${i+1} Name</label><input id="ground${i+1}" placeholder="Ground ${i+1}">`).join("")}
function saveTournament(){
 const name=tourName.value.trim();if(!name){alert("Tournament Name जरूरी है.");return}
 const grounds=Array.from({length:+tourGrounds.value},(_,i)=>document.getElementById("ground"+(i+1)).value.trim()||"Ground "+(i+1));
 tournaments.push({id:id("TOUR"),name,date:tourDate.value,location:tourLocation.value,grounds,teamIds:[],matches:[],created:new Date().toLocaleDateString(),ownerMobile:account.mobile,auction:{players:[],tokens:[]}});
 saveAll();closeModal();renderCompetitions();alert("🏆 Tournament created.")
}
function addTeamToTournament(tid){
 const t=tournaments.find(x=>x.id===tid);if(!t)return
 if(t.teamIds.length>=32){alert("Maximum tournament teams reached.");return}
 openModal("➕ Add Team to Tournament",teams.map(team=>`<div class="list"><div class="teamHead">${team.logo?`<img class="teamLogo" src="${team.logo}">`:`<div class="teamLogo">🏏</div>`}<div><h3>${esc(team.name)}</h3><div class="small">${team.players.length}/15 Players • ${team.support.length}/5 Support</div></div></div><button class="btn full" onclick="attachTeam('${tid}','${team.id}')">${t.teamIds.includes(team.id)?"✅ Already Added":"➕ Add This Team"}</button></div>`).join("")||'<div class="empty">पहले Team बनाएं.</div>')
}
function attachTeam(tid,teamid){const t=tournaments.find(x=>x.id===tid);if(!t)return;if(!t.teamIds.includes(teamid))t.teamIds.push(teamid);saveAll();closeModal();renderCompetitions();alert("✅ Team added.")}
function openTournament(tid){const t=tournaments.find(x=>x.id===tid);if(!t)return;selectedTournamentId=tid;
 const ts=t.teamIds.map(id=>teams.find(x=>x.id===id)).filter(Boolean);
 openModal("🏆 "+esc(t.name),`
 <div class="notice">${esc(t.date||"Date not set")} • ${esc(t.location||"Location not set")} • ${t.grounds.map(esc).join(" • ")}</div>
 <h3>🏟️ Grounds</h3>${t.grounds.map((g,i)=>`<div class="list"><b>Ground ${i+1}: ${esc(g)}</b></div>`).join("")}
 <h3>👥 Teams (${ts.length})</h3>${ts.length?ts.map(team=>teamCard(team,tid)).join(""):'<div class="empty">No teams added.</div>'}
 <div class="actions">
 <button class="btn" onclick="openAuction('${tid}')">🔨 AUCTION</button>
 <button class="btn blue" onclick="createTournamentMatch('${tid}')">🏏 Create Tournament Match</button>
 </div>`)
}
function teamCard(team,tid){return `<div class="card"><div class="teamHead">${team.logo?`<img class="teamLogo" src="${team.logo}">`:`<div class="teamLogo">🏏</div>`}<div><h3>${esc(team.name)}</h3><div class="small">${team.players.length}/15 Players • ${team.support.length}/5 Support</div></div></div><div class="actions"><button class="btn dark" onclick="openTeamDetails('${team.id}')">📋 Team Details</button><button class="btn" onclick="managePlaying11('${tid}','${team.id}')">🏏 Playing 11</button></div></div>`}
function openTeamDetails(tid){const t=teams.find(x=>x.id===tid);if(!t)return;openModal("🏏 "+esc(t.name),`<div class="teamHead">${t.logo?`<img class="teamLogo" src="${t.logo}">`:`<div class="teamLogo">🏏</div>`}<h2>${esc(t.name)}</h2></div><h3>Players (${t.players.length}/15)</h3>${t.players.map((p,i)=>playerCard(p,i)).join("")}<h3>Support (${t.support.length}/5)</h3>${t.support.map(x=>`<div class="list">${esc(x)}</div>`).join("")||'<div class="empty">No support members.</div>'}`)}
function playerCard(p,i){return `<div class="playerRow">${p.photo?`<img class="playerMini" src="${p.photo}">`:`<div class="playerMini">🏏</div>`}<div style="flex:1"><b>${i+1}. ${esc(p.name)}</b><div class="small">ID ${esc(p.id)} • #${esc(p.jerseyNumber)} • ${esc(p.role)}</div><div class="small">${esc(p.batting)} • ${esc(p.bowling)} • Jersey ${esc(p.jerseySize)} • Pant ${esc(p.pantSize)}</div></div><button class="btn dark" onclick="fullPlayerDetails(players.find(x=>x.id==='${p.id}'))">Details</button></div>`}
function managePlaying11(tid,teamid){
 const t=teams.find(x=>x.id===teamid);if(!t)return
 let eleven=t.players.slice(0,11).map(p=>p.id);
 openModal("🏏 Select Playing 11 — "+esc(t.name),`<p class="small">Select exactly 11 players.</p><div id="p11box">${t.players.map(p=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="p11" value="${p.id}" ${eleven.includes(p.id)?"checked":""}> ${esc(p.name)} — #${esc(p.jerseyNumber)}</label>`).join("")}</div><button class="btn full" onclick="savePlaying11('${tid}','${teamid}')">💾 Save Playing 11</button>`)
}
function savePlaying11(tid,teamid){const ids=[...document.querySelectorAll(".p11:checked")].map(x=>x.value);if(ids.length!==11){alert("Exactly 11 players select करें.");return}const t=teams.find(x=>x.id===teamid);t.playing11=ids;saveAll();closeModal();openTournament(tid)}

function canViewAuction(t){
 const me=account?.mobile||"";
 if(me && me===t.ownerMobile) return true;
 return (t.auction?.players||[]).some(x=>String(x.mobile)===String(me));
}
function openAuction(tid){
 const t=tournaments.find(x=>x.id===tid); if(!t)return;
 t.auction=t.auction||{players:[],tokens:[]};
 if(!canViewAuction(t)){
   openModal("🔒 Private AUCTION",`<div class="auctionLock">
   <h3>🔐 Access Restricted</h3>
   <p>इस Tournament की Auction Player List private है.</p>
   <p class="small">सिर्फ Tournament Owner या जिस mobile number का player Auction में add है, वही access कर सकता है.</p>
   </div>`);
   return;
 }
 const isOwner=account.mobile===t.ownerMobile;
 const mine=t.auction.players.filter(p=>String(p.mobile)===String(account.mobile));
 openModal("🔨 AUCTION — "+esc(t.name),`
 ${isOwner?`<div class="notice">Admin access: आप mobile number से player add कर सकते हैं. बाकी users केवल अपना authorized token देख सकते हैं.</div>
 <label>Player Mobile Number</label><input id="auctionMobile" type="tel" placeholder="Player mobile number">
 <button class="btn full" onclick="addAuctionPlayer('${tid}')">➕ Add Player to Auction</button>`:""}
 <h3>🎟️ My Token</h3>
 ${mine.length?mine.map(p=>auctionTokenBlock(tid,p)).join(""):'<div class="empty">आपका कोई Auction Token नहीं है.</div>'}
 ${isOwner?`<h3>👥 Authorized Auction Players</h3>
 <div id="auctionAdminList">${t.auction.players.length?t.auction.players.map(p=>auctionAdminRow(tid,p)).join(""):'<div class="empty">No players added.</div>'}</div>`:""}
 `);
}
function auctionAdminRow(tid,p){
 return `<div class="playerRow">
 ${p.photo?`<img class="playerMini" src="${p.photo}">`:`<div class="playerMini">🏏</div>`}
 <div style="flex:1"><b>${esc(p.name)}</b><div class="small">📱 ${esc(p.mobile)} • 🆔 ${esc(p.id)} • Token ${esc(p.tokenNo)}</div></div>
 <button class="btn" onclick="generateToken('${tid}','${p.id}')">🎟️ Token</button>
 <button class="btn red" onclick="removeAuctionPlayer('${tid}','${p.id}')">Remove</button>
 </div>`;
}
function addAuctionPlayer(tid){
 const t=tournaments.find(x=>x.id===tid); if(!t)return;
 if(account.mobile!==t.ownerMobile){alert("Only Tournament Owner can add Auction players.");return}
 const q=auctionMobile.value.trim();
 if(!q){alert("Mobile number डालें.");return}
 const p=players.find(x=>String(x.mobile)===q);
 if(!p){alert("इस mobile number का player profile नहीं मिला.");return}
 t.auction=t.auction||{players:[],tokens:[]};
 if(t.auction.players.some(x=>x.id===p.id)){alert("Player already added.");return}
 const tokenNo=String(t.auction.players.length+1).padStart(2,"0");
 const entry={id:p.id,name:p.name,mobile:p.mobile,photo:p.photo||"",role:p.role,batting:p.batting,bowling:p.bowling,jerseyName:p.jerseyName,jerseyNumber:p.jerseyNumber,jerseySize:p.jerseySize,pantSize:p.pantSize,tokenNo,addedAt:new Date().toISOString()};
 t.auction.players.push(entry);
 saveAll();openAuction(tid);
}
function removeAuctionPlayer(tid,pid){
 const t=tournaments.find(x=>x.id===tid);if(!t)return;
 if(account.mobile!==t.ownerMobile)return;
 t.auction.players=t.auction.players.filter(p=>p.id!==pid);
 // Re-number tokens after removal.
 t.auction.players.forEach((p,i)=>p.tokenNo=String(i+1).padStart(2,"0"));
 saveAll();openAuction(tid);
}
function auctionTokenBlock(tid,p){
 return `<div class="tokenCard">
 <canvas id="token_${esc(p.id)}" class="tokenCanvas" width="900" height="1200"></canvas>
 <div class="actions" style="justify-content:center">
 <button class="btn" onclick="generateToken('${tid}','${p.id}')">🎨 Generate Token</button>
 <button class="btn blue" onclick="downloadToken('${tid}','${p.id}')">⬇️ Download Token</button>
 </div>
 </div>`;
}
function getAuctionPlayer(tid,pid){
 const t=tournaments.find(x=>x.id===tid);return t?.auction?.players?.find(x=>x.id===pid);
}
function generateToken(tid,pid){
 const t=tournaments.find(x=>x.id===tid),p=getAuctionPlayer(tid,pid);if(!t||!p)return;
 if(account.mobile!==t.ownerMobile && String(account.mobile)!==String(p.mobile)){
   alert("इस token को देखने की अनुमति नहीं है.");return;
 }
 const c=document.getElementById("token_"+pid);if(!c)return;
 const ctx=c.getContext("2d"),W=c.width,H=c.height;
 ctx.clearRect(0,0,W,H);
 const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,"#071a2a");grad.addColorStop(1,"#173d5b");
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#ffb719";ctx.lineWidth=10;ctx.strokeRect(24,24,W-48,H-48);
 ctx.fillStyle="#ffb719";ctx.textAlign="center";
 ctx.font="900 58px Arial";ctx.fillText("🏏 CRIC YUVA",W/2,105);
 ctx.fillStyle="#ffffff";ctx.font="800 40px Arial";ctx.fillText("AUCTION TOKEN",W/2,165);
 // Profile photo.
 if(p.photo){
   const im=new Image();im.onload=()=>{drawTokenImage(ctx,c,W,H,p,im)};im.src=p.photo;
 }else drawTokenImage(ctx,c,W,H,p,null);
}
function drawTokenImage(ctx,c,W,H,p,im){
 if(im){
   const size=390,x=(W-size)/2,y=205;
   ctx.save();ctx.beginPath();ctx.arc(W/2,y+size/2,size/2,0,Math.PI*2);ctx.clip();
   const ratio=Math.max(size/im.width,size/im.height),iw=im.width*ratio,ih=im.height*ratio;
   ctx.drawImage(im,(W-iw)/2,y+(size-ih)/2,iw,ih);ctx.restore();
   ctx.strokeStyle="#ffb719";ctx.lineWidth=12;ctx.beginPath();ctx.arc(W/2,y+size/2,size/2,0,Math.PI*2);ctx.stroke();
 }else{ctx.fillStyle="#24445e";ctx.beginPath();ctx.arc(W/2,400,190,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="800 42px Arial";ctx.fillText("PLAYER",W/2,415)}
 ctx.fillStyle="#fff";ctx.textAlign="center";
 ctx.font="900 74px Arial";ctx.fillText(String(p.tokenNo||"00"),W/2,720);
 ctx.fillStyle="#ffb719";ctx.font="900 48px Arial";ctx.fillText(String(p.name||"PLAYER").toUpperCase(),W/2,790);
 ctx.fillStyle="#d9e4ed";ctx.font="700 32px Arial";ctx.fillText("Player ID: "+p.id,W/2,850);
 ctx.fillText("Jersey #"+(p.jerseyNumber||"00")+" • "+(p.jerseySize||"M"),W/2,900);
 ctx.fillText("Role: "+(p.role||"—"),W/2,950);
 ctx.fillStyle="#91a8bb";ctx.font="26px Arial";ctx.fillText("CRIC YUVA • AUCTION",W/2,1100);
 ctx.font="22px Arial";ctx.fillText("Generated automatically from Player Profile",W/2,1140);
}
function downloadToken(tid,pid){
 const t=tournaments.find(x=>x.id===tid),p=getAuctionPlayer(tid,pid);if(!t||!p)return;
 if(account.mobile!==t.ownerMobile && String(account.mobile)!==String(p.mobile)){alert("Download access denied.");return}
 const c=document.getElementById("token_"+pid);if(!c){alert("पहले Generate Token करें.");return}
 const a=document.createElement("a");a.download=`CRIC-YUVA-AUCTION-TOKEN-${p.tokenNo}-${(p.name||"PLAYER").replace(/\s+/g,"-")}.png`;a.href=c.toDataURL("image/png");a.click();
}

function createTournamentMatch(tid){const t=tournaments.find(x=>x.id===tid);const ts=t.teamIds.map(x=>teams.find(y=>y.id===x)).filter(Boolean);if(ts.length<2){alert("कम से कम 2 teams जोड़ें.");return}openModal("🏏 Tournament Match",`<label>Team A</label><select id="tmA">${ts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><label>Team B</label><select id="tmB">${ts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><label>Ground</label><select id="tmGround">${t.grounds.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join("")}</select><button class="btn full" onclick="saveTournamentMatch('${tid}')">🏏 Create Match</button>`)}
function saveTournamentMatch(tid){if(tmA.value===tmB.value){alert("Team A और Team B अलग होने चाहिए.");return}const t=tournaments.find(x=>x.id===tid);const m={id:id("MATCH"),type:"Tournament Match",teamA:tmA.value,teamB:tmB.value,ground:t.grounds[+tmGround.value],status:"Scheduled",created:new Date().toLocaleDateString(),teamAPlayers:teamPlayers(tmA.value),teamBPlayers:teamPlayers(tmB.value)};matches.push(m);t.matches.push(m.id);saveAll();closeModal();renderCompetitions();alert("✅ Tournament match created.")}
function teamPlayers(tid){return (teams.find(x=>x.id===tid)?.players||[]).map(x=>({...x}))}

function createSingleMatch(){
 openModal("🏏 Single Match",`<label>Match Type</label><select id="smType"><option>Practice Match</option><option>Friendly Match</option><option>Series Match</option><option>Tournament Match</option></select><label>Team A</label><select id="smA">${teams.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><label>Team B</label><select id="smB">${teams.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><button class="btn full" onclick="saveSingleMatch()">🏏 Create Match</button>`)
}
function saveSingleMatch(){if(!smA.value||!smB.value||smA.value===smB.value){alert("दो अलग teams चुनें.");return}matches.push({id:id("MATCH"),type:smType.value,teamA:smA.value,teamB:smB.value,status:"Scheduled",created:new Date().toLocaleDateString(),teamAPlayers:teamPlayers(smA.value),teamBPlayers:teamPlayers(smB.value)});saveAll();closeModal();renderCompetitions();alert("✅ Match created.")}
function createSeries(){openModal("📚 Create Series",`<label>Series Name</label><input id="seriesName" placeholder="Series Name"><label>Team A</label><select id="seriesA">${teams.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><label>Team B</label><select id="seriesB">${teams.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><label>Number of Matches</label><select id="seriesCount"><option>2</option><option>3</option><option>5</option></select><button class="btn full" onclick="saveSeries()">📚 Create Series</button>`)}
function saveSeries(){if(seriesA.value===seriesB.value){alert("दो अलग teams चुनें.");return}const s={id:id("SERIES"),name:seriesName.value.trim()||"Series",teamA:seriesA.value,teamB:seriesB.value,count:+seriesCount.value,matches:[],created:new Date().toLocaleDateString()};for(let i=0;i<s.count;i++){const m={id:id("MATCH"),type:"Series Match",seriesId:s.id,seriesGame:i+1,teamA:s.teamA,teamB:s.teamB,status:"Scheduled",created:new Date().toLocaleDateString(),teamAPlayers:teamPlayers(s.teamA),teamBPlayers:teamPlayers(s.teamB)};matches.push(m);s.matches.push(m.id)}series.push(s);saveAll();closeModal();renderCompetitions();alert("✅ Series created.")}
function renderCompetitions(){
 competitionList.innerHTML=`<div class="card"><h2>🏆 Tournaments</h2>${tournaments.length?tournaments.map(t=>`<div class="list"><b>🏆 ${esc(t.name)}</b><div class="small">${esc(t.date||"")} • ${esc(t.location||"")} • ${t.grounds.length} Grounds • ${t.teamIds.length} Teams</div><div class="actions"><button class="btn" onclick="openTournament('${t.id}')">Open Tournament</button><button class="btn dark" onclick="addTeamToTournament('${t.id}')">➕ Add Team</button></div></div>`).join(""):'<div class="empty">No tournaments yet.</div>'}</div>
 <div class="card"><h2>👥 Teams</h2>${teams.length?teams.map(t=>`<div class="list">${teamCard(t,"")}</div>`).join(""):'<div class="empty">No teams yet.</div>'}</div>
 <div class="card"><h2>🏏 Matches</h2>${matches.length?matches.map(m=>{const a=teams.find(t=>t.id===m.teamA),b=teams.find(t=>t.id===m.teamB);return `<div class="list"><h3>${esc(a?.name||"Team A")} 🆚 ${esc(b?.name||"Team B")}</h3><div class="small">${esc(m.type)} • ${esc(m.ground||"Ground not set")} • ${esc(m.status)}</div><div class="actions"><button class="btn" onclick="openMatch('${m.id}')">Open Match</button><button class="btn dark" onclick="editMatchPlayers('${m.id}')">✏️ Edit Players</button></div></div>`}).join(""):'<div class="empty">No matches yet.</div>'}</div>
 <div class="card"><h2>📚 Series</h2>${series.length?series.map(s=>`<div class="list"><b>${esc(s.name)}</b><div class="small">${s.count} Matches</div></div>`).join(""):'<div class="empty">No series yet.</div>'}</div>`
}
function openMatch(mid){const m=matches.find(x=>x.id===mid);if(!m)return;const a=teams.find(t=>t.id===m.teamA),b=teams.find(t=>t.id===m.teamB);openModal("🏏 Match Details",`<div class="grid"><div class="card"><h2>${esc(a?.name)}</h2>${(a?.logo?`<img class="teamLogo" src="${a.logo}">`:"")}<h3>Playing 11</h3>${(a?.playing11||a?.players.slice(0,11).map(p=>p.id)).map(pid=>playerCard((a.players||[]).find(p=>p.id===pid)||players.find(p=>p.id===pid),0)).join("")}</div><div class="card"><h2>${esc(b?.name)}</h2>${(b?.logo?`<img class="teamLogo" src="${b.logo}">`:"")}<h3>Playing 11</h3>${(b?.playing11||b?.players.slice(0,11).map(p=>p.id)).map(pid=>playerCard((b.players||[]).find(p=>p.id===pid)||players.find(p=>p.id===pid),0)).join("")}</div></div><button class="btn full" onclick="startLive('${mid}')">▶️ Start Live Scoring</button>`)}
function editMatchPlayers(mid){
 const m=matches.find(x=>x.id===mid);
 if(!m)return;
 const body=`<p class="small">Player को remove/replace कर सकते हैं. Search Mobile / ID / Name.</p>
 ${["A","B"].map(side=>{
   const arr=side==="A"?(m.teamAPlayers||[]):(m.teamBPlayers||[]);
   return `<h3>Team ${side}</h3>${
     arr.map((p,i)=>`<div class="playerRow">
       <div style="flex:1"><b>${i+1}. ${esc(p.name)}</b><div class="small">${esc(p.id)}</div></div>
       <button class="btn red" onclick="replaceMatchPlayer('${mid}','${side}',${i})">Replace</button>
     </div>`).join("")
   }`;
 }).join("")}
 <button class="btn full" onclick="closeModal()">Done</button>`;
 openModal("✏️ Edit Match Players",body);
}
function replaceMatchPlayer(mid,side,index){const q=prompt("New Player Mobile / ID / Name:");if(!q)return;const found=players.find(p=>String(p.id).toLowerCase().includes(q.toLowerCase())||String(p.name||"").toLowerCase().includes(q.toLowerCase())||String(p.mobile||"").includes(q));if(!found){alert("Player नहीं मिला.");return}const m=matches.find(x=>x.id===mid);const arr=side==="A"?m.teamAPlayers:m.teamBPlayers;arr[index]={...found};saveAll();editMatchPlayers(mid)}

function startLive(mid){const m=matches.find(x=>x.id===mid);live={matchId:mid,scoreA:0,wicketsA:0,balls:0,history:[],status:"LIVE"};saveAll();openLive(mid)}
function openLive(mid){const m=matches.find(x=>x.id===mid);openModal("🔴 LIVE SCORE",`<div class="score">${live.scoreA}/${live.wicketsA}</div><div class="small" style="text-align:center">${Math.floor(live.balls/6)}.${live.balls%6} overs</div><div class="scoreButtons">${[0,1,2,3,4,6].map(n=>`<button onclick="liveRun(${n},'${mid}')">${n}</button>`).join("")}<button onclick="liveWide('${mid}')">Wide</button><button onclick="liveNoBall('${mid}')">No Ball</button><button onclick="liveWicket('${mid}')">Wicket</button><button onclick="undoLive('${mid}')">↩ Undo</button></div><button class="btn full" onclick="finishLive('${mid}')">⏹ Finish Match</button>`)}
function liveRun(n,mid){live.scoreA+=n;live.balls++;live.history.push({type:"run",n});saveAll();openLive(mid)}
function liveWide(mid){live.scoreA++;live.history.push({type:"wide"});saveAll();openLive(mid)}
function liveNoBall(mid){live.scoreA++;live.history.push({type:"noball"});saveAll();openLive(mid)}
function liveWicket(mid){live.wicketsA++;live.balls++;live.history.push({type:"wicket"});saveAll();openLive(mid)}
function undoLive(mid){if(!live.history.length)return;live.history.pop();live.scoreA=0;live.wicketsA=0;live.balls=0;live.history.forEach(x=>{if(x.type==="run"){live.scoreA+=x.n;live.balls++}else if(x.type==="wide"||x.type==="noball")live.scoreA++;else{live.wicketsA++;live.balls++}});saveAll();openLive(mid)}
function finishLive(mid){const m=matches.find(x=>x.id===mid);m.status="Completed";m.result=(live.scoreA+"/"+live.wicketsA);saveAll();closeModal();renderCompetitions();alert("✅ Match completed.")}

function renderFriends(){friendsList.innerHTML=friends.length?friends.map(f=>`<div class="list">${esc(f.name)} — ${esc(f.status||"Friend")}</div>`).join(""):'<div class="empty">No friends yet.</div>'}
function renderChat(){chatMessages.innerHTML=chats.length?chats.map(c=>`<div class="list"><b>${esc(c.name)}</b><br>${esc(c.text)}<div class="small">${esc(c.time)}</div></div>`).join(""):'<div class="empty">No messages yet.</div>'}
function sendChat(){const text=chatInput.value.trim();if(!text)return;chats.push({name:profile?.name||"Player",text,time:new Date().toLocaleTimeString()});chatInput.value="";saveAll();renderChat()}
function openSettings(){openModal("⚙️ Settings",`<div class="detailGrid">${detail("App","CRIC YUVA")}${detail("Version","V3 Final Test")}${detail("Player ID",profile?.id)}${detail("Mobile",account?.mobile)}</div>
 <div class="subscription"><b>🎁 Subscription</b><br>
 ${subscriptionInfo(account).active?`6 Months Free • ${subscriptionInfo(account).days} days remaining`:"Free period expired — subscription can be added later."}
 </div>
 <button class="btn red full" onclick="localReset()">Reset Local App Data</button>`)}
function localReset(){if(confirm("All local CRIC YUVA data delete करें?")){Object.values(K).forEach(k=>localStorage.removeItem(k));location.reload()}}
</script>
