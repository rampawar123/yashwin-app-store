<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRIC YUVA - Version 1.0</title>

<meta name="theme-color" content="#111111">
<meta name="description" content="CRIC YUVA - Cricket Tournament, Live Score, Auction & More">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #0d0d0d;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}

.app {
    width: 100%;
    max-width: 430px;
    min-height: 92vh;
    background: #151515;
    border: 2px solid #ff9800;
    border-radius: 30px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255, 152, 0, 0.15);
}

.logo-box {
    width: 150px;
    height: 150px;
    margin: 5px auto 22px;
    border: 3px solid #ff9800;
    border-radius: 35px;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.title {
    color: #ff9800;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 1px;
}

.version {
    color: #888888;
    font-size: 15px;
    margin-top: 8px;
    font-weight: bold;
}

.subtitle {
    margin-top: 28px;
    font-size: 25px;
    font-weight: bold;
}

.description {
    color: #aaaaaa;
    font-size: 17px;
    line-height: 1.5;
    margin-top: 12px;
}

.buttons {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.main-btn {
    width: 100%;
    min-height: 58px;
    border-radius: 16px;
    border: 2px solid #ff9800;
    background: #171717;
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
}

.main-btn:active {
    transform: scale(0.97);
}

.download-btn {
    background: #ff9800;
    color: #111111;
}

.share-btn {
    background: #202020;
}

.message {
    min-height: 24px;
    margin-top: 18px;
    color: #ffb74d;
    font-size: 14px;
    line-height: 1.4;
}

.footer {
    margin-top: 35px;
    color: #666666;
    font-size: 13px;
    line-height: 1.5;
}

@media (max-width: 380px) {
    .app {
        padding: 24px 16px;
    }

    .logo-box {
        width: 125px;
        height: 125px;
    }

    .title {
        font-size: 32px;
    }

    .subtitle {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="logo-box">
        <img src="cric-yuva-logo.png" alt="CRIC YUVA Logo">
    </div>

    <div class="title">CRIC YUVA</div>

    <div class="version">VERSION 1.0</div>

    <div class="subtitle">Cricket Community Platform</div>

    <div class="description">
        Cricket Tournament, Live Score,<br>
        Auction & More
    </div>

    <div class="buttons">

        <button class="main-btn download-btn"
                onclick="downloadApp()">
            📥 DOWNLOAD APK
        </button>

        <button class="main-btn"
                onclick="openApp()">
            ▶️ OPEN APP
        </button>

        <button class="main-btn share-btn"
                onclick="shareApp()">
            🔗 SHARE APP
        </button>

    </div>

    <div class="message" id="message"></div>

    <div class="footer">
        CRIC YUVA • VERSION 1.0<br>
        Cricket Tournament • Live Score • Auction
    </div>

</div>

<script>

function showMessage(text) {
    const message = document.getElementById("message");
    message.textContent = text;

    setTimeout(function() {
        message.textContent = "";
    }, 3000);
}


/* APK DOWNLOAD
   Final APK upload hone ke baad
   cric-yuva.apk isi folder me rakhenge.
*/
function downloadApp() {

    const apkUrl = "cric-yuva.apk";

    const link = document.createElement("a");
    link.href = apkUrl;
    link.download = "CRIC-YUVA.apk";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    showMessage("CRIC YUVA APK download started.");
}


/* OPEN APP
   Final Android APK/package ready hone ke baad
   is function me actual app opening system connect karenge.
*/
function openApp() {

    showMessage(
        "CRIC YUVA app opening will be connected after APK installation."
    );
}


/* SHARE APP */
async function shareApp() {

    const shareData = {
        title: "CRIC YUVA",
        text: "Download CRIC YUVA - Cricket Tournament, Live Score, Auction & More",
        url: window.location.href
    };

    try {

        if (navigator.share) {

            await navigator.share(shareData);

        } else {

            await navigator.clipboard.writeText(window.location.href);

            showMessage("CRIC YUVA link copied. Now share it anywhere.");

        }

    } catch (error) {

        if (error.name !== "AbortError") {
            showMessage("Share cancelled or unavailable.");
        }

    }
}

</script>

</body>
</html>
