<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff9800">
<title>CRIC YUVA - Version 1.0</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#101010;
  color:#fff;
  min-height:100vh;
}

.app{
  width:calc(100% - 28px);
  max-width:650px;
  margin:18px auto;
  min-height:calc(100vh - 36px);
  border:2px solid #ff9800;
  border-radius:32px;
  padding:28px 22px;
  box-shadow:0 0 30px rgba(255,152,0,.12);
}

.logo{
  width:230px;
  height:230px;
  margin:0 auto 18px;
  border:3px solid #ff9800;
  border-radius:42px;
  overflow:hidden;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.title{
  text-align:center;
  color:#ff9800;
  font-size:42px;
  font-weight:900;
  letter-spacing:1px;
}

.version{
  text-align:center;
  color:#888;
  font-size:18px;
  font-weight:bold;
  margin-top:8px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.home-description{
  text-align:center;
  margin:38px 0 28px;
}

.home-description h2{
  font-size:25px;
  margin-bottom:15px;
}

.home-description p{
  color:#aaa;
  font-size:18px;
  line-height:1.5;
}

.btn{
  width:100%;
  min-height:62px;
  border-radius:20px;
  border:2px solid #ff9800;
  font-size:20px;
  font-weight:800;
  margin-top:14px;
  cursor:pointer;
  transition:.2s;
}

.btn:active{
  transform:scale(.98);
}

.primary{
  background:#ff9800;
  color:#111;
}

.secondary{
  background:#171717;
  color:#fff;
}

.login-card{
  margin-top:35px;
  background:#171717;
  border:1px solid #333;
  border-radius:24px;
  padding:22px;
}

.login-card h2{
  color:#ff9800;
  text-align:center;
  margin-bottom:20px;
}

label{
  display:block;
  color:#ddd;
  font-weight:bold;
  margin:14px 0 7px;
}

input{
  width:100%;
  height:55px;
  border-radius:14px;
  border:1px solid #555;
  background:#050505;
  color:#fff;
  padding:0 15px;
  font-size:17px;
  outline:none;
}

input:focus{
  border-color:#ff9800;
}

.phone-row{
  display:flex;
  gap:8px;
}

.country{
  width:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#292929;
  border-radius:14px;
  color:#fff;
  font-weight:bold;
}

.phone-row input{
  flex:1;
}

.code-box{
  display:none;
  margin-top:15px;
  padding:15px;
  border-radius:15px;
  background:#221a0d;
  border:1px solid #ff9800;
}

.code-box.show{
  display:block;
}

.demo-code{
  color:#ff9800;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  margin-top:8px;
  letter-spacing:5px;
}

.message{
  text-align:center;
  min-height:25px;
  margin-top:15px;
  color:#ff9800;
  font-weight:bold;
}

.profile{
  margin-top:30px;
  padding:22px;
  border-radius:24px;
  background:#171717;
  border:1px solid #333;
}

.profile h2{
  color:#ff9800;
  margin-bottom:15px;
}

.profile-row{
  padding:12px 0;
  border-bottom:1px solid #333;
  color:#ccc;
}

.profile-row strong{
  color:#fff;
}

.main-menu{
  margin-top:28px;
}

.main-menu .btn{
  margin-top:10px;
}

.footer{
  text-align:center;
  color:#666;
  font-size:13px;
  margin-top:45px;
  line-height:1.6;
}

.back{
  background:transparent;
  border:0;
  color:#aaa;
  font-size:16px;
  margin-top:18px;
  cursor:pointer;
}

@media(max-width:420px){
  .app{
    width:calc(100% - 18px);
    padding:22px 15px;
    border-radius:28px;
  }

  .logo{
    width:190px;
    height:190px;
  }

  .title{
    font-size:35px;
  }

  .version{
    font-size:16px;
  }

  .btn{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="logo">
    <img src="cric-yuva-logo.png" alt="CRIC YUVA Logo">
  </div>

  <div class="title">CRIC YUVA</div>
  <div class="version">VERSION 1.0</div>


  <!-- START SCREEN -->
  <section id="startScreen" class="screen active">

    <div class="home-description">
      <h2>Cricket Community Platform</h2>
      <p>
        Cricket Tournament, Live Score,<br>
        Auction & More
      </
