
name: Build Hi Ram Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'hi-ram-android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Hi Ram APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HI_RAM_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > hi-ram-android/app/hi-ram-release.jks
          test -s hi-ram-android/app/hi-ram-release.jks
          chmod 600 hi-ram-android/app/hi-ram-release.jks

      - name: Build Debug and Signed Release APK
        working-directory: hi-ram-android
        env:
          KEYSTORE_FILE: hi-ram-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.HI_RAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: hiram-release
          KEY_PASSWORD: ${{ secrets.HI_RAM_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify Release APK signature
        run: |
          set -e
          APK="hi-ram-android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -f "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Publish HI RAM APK
        run: |
          set -e
          cp hi-ram-android/app/build/outputs/apk/release/app-release.apk HI-RAM.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HI-RAM.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update HI RAM signed APK"
            git push
          else
            echo "HI-RAM.apk is already up to date"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hi-Ram-debug-APK
          path: hi-ram-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Hi-Ram-signed-release-APK
          path: hi-ram-android/app/build/outputs/apk/release/app-release.apk
          
