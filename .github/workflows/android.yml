
name: Build Hi Ram Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hi-ram-android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: hi-ram-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hi-Ram-debug-APK
          path: hi-ram-android/app/build/outputs/apk/debug/app-debug.apk
          
