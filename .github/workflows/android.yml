
      - name: Publish HI RAM APK
        run: |
          set -e
          git pull --rebase origin main
          cp hi-ram-android/app/build/outputs/apk/release/app-release.apk HI-RAM.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HI-RAM.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update HI RAM signed APK"
            git push origin HEAD:main
          else
            echo "HI-RAM.apk is already up to date"
          fi
          
