name: Build VANSH CALCULATOR APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Bubblewrap manifest
        run: |
          bubblewrap init --manifest https://rampawar123.github.io/yashwin-app-store/manifest.json

      - name: Generate Android project
        run: |
          bubblewrap updateConfig --jdkPath "$JAVA_HOME_17_X64" --androidSdkPath "$ANDROID_HOME" || true
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VANSH-CALCULATOR-APK
          path: |
            **/*.apk
