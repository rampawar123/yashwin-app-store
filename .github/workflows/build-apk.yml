name: Build YASHWIN APP STORE APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PERMANENT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/permanent-release.jks"
          chmod 600 "$RUNNER_TEMP/permanent-release.jks"

      - name: Create TWA manifest
        env:
          KEY_ALIAS: ${{ secrets.PERMANENT_KEYSTORE_ALIAS }}
        run: |
          test -n "$KEY_ALIAS"
          mkdir -p twa
          cp "$RUNNER_TEMP/permanent-release.jks" twa/permanent-release.jks
          cat > twa/twa-manifest.json <<EOF
          {
            "packageId": "com.yashwin.appstore",
            "host": "rampawar123.github.io",
            "name": "YASHWIN APP STORE",
            "launcherName": "YASHWIN APP STORE",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": false,
            "startUrl": "/yashwin-app-store/",
            "iconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512.png",
            "maskableIconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "permanent-release.jks",
              "alias": "$KEY_ALIAS"
            },
            "appVersionName": "1.0",
            "appVersionCode": $GITHUB_RUN_NUMBER
          }
          EOF

      - name: Generate Android Project
        working-directory: twa
        run: bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

      - name: Build signed APK and AAB
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.PERMANENT_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.PERMANENT_KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.PERMANENT_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PERMANENT_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: YASHWIN-APP-STORE-APK
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
          if-no-files-found: error
