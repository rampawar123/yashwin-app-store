name: Build YASHWIN APP STORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Create Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap

          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Create signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -f android.keystore

          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias yashwin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=YASHWIN APP STORE, OU=YASHWIN, O=YASHWIN, L=India, ST=Maharashtra, C=IN"

      - name: Create TWA manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -rf twa
          mkdir -p twa

          cp android.keystore twa/android.keystore

          cat > twa/twa-manifest.json <<EOF
          {
            "packageId": "com.yashwin.appstore",
            "host": "rampawar123.github.io",
            "name": "YASHWIN APP STORE",
            "launcherName": "YASHWIN APP STORE",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": true,
            "startUrl": "/yashwin-app-store/",
            "iconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512.png",
            "maskableIconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "yashwin"
            },
            "appVersionName": "1.0",
            "appVersionCode": 1
          }
          EOF

      - name: Prepare Bubblewrap project
        run: |
          cd twa
          yes | bubblewrap update --skipVersionUpgrade

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd twa
          bubblewrap build --skipPwaValidation

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: YASHWIN-APP-STORE
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
