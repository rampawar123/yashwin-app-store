name: Build YASHWIN APP STORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Create signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          rm -f android.keystore

          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias yashwin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=YASHWIN APP STORE, OU=YASHWIN, O=YASHWIN, L=India, ST=Maharashtra, C=IN"

      - name: Create TWA manifest
        run: |
          rm -rf twa
          mkdir -p twa

          cat > twa/twa-manifest.json <<'EOF'
          {
            "packageId": "com.yashwin.appstore",
            "host": "rampawar123.github.io",
            "name": "YASHWIN APP STORE",
            "launcherName": "YASHWIN APP STORE",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#111111",
            "themeColorDark": "#111111",
            "navigationColor": "#111111",
            "navigationColorDark": "#111111",
            "navigationDividerColor": "#111111",
            "navigationDividerColorDark": "#111111",
            "backgroundColor": "#111111",
            "startUrl": "/yashwin-app-store/",
            "iconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512.png",
            "maskableIconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "minSdkVersion": 19,
            "enableNotifications": true,
            "signingKey": {
              "path": "../android.keystore",
              "alias": "yashwin"
            },
            "webManifestUrl": "https://rampawar123.github.io/yashwin-app-store/manifest.json",
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "generatorApp": "bubblewrap-cli"
          }
          EOF

      - name: Generate Android project
        run: |
          cd twa
          bubblewrap update --manifest=twa-manifest.json

      - name: Build signed APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          cd twa
          bubblewrap build \
            --manifest=twa-manifest.json \
            --signingKeyPath=../android.keystore \
            --signingKeyAlias=yashwin \
            --skipPwaValidation

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: YASHWIN-APP-STORE-APK
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
            twa/app-release-signed.apk.idsig
