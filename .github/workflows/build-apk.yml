name: Build YASHWIN APP STORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat "$HOME/.bubblewrap/config.json"

      - name: Prepare Bubblewrap project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -rf twa
          mkdir -p twa

          cd twa

          printf 'n\n%s\nn\n%s\n\n\n\n\n\n' \
            "$JAVA_HOME" \
            "$ANDROID_HOME" \
            | bubblewrap init \
                --manifest="https://rampawar123.github.io/yashwin-app-store/manifest.json" \
                --directory="."

      - name: Build signed APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd twa

          bubblewrap build \
            --skipPwaValidation

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: YASHWIN-APP-STORE-APK
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
            twa/app-release-signed.apk.idsig
          if-no-files-found: error
