name: Build VANSH CALCULATOR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME_17_X64" \
            --androidSdkPath="$ANDROID_HOME"

      - name: Check Bubblewrap environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          echo "ANDROID_HOME=$ANDROID_HOME"
          bubblewrap doctor

      - name: Create Bubblewrap manifest
        run: |
          mkdir -p twa

          cat > twa/twa-manifest.json <<'EOF'
          {
            "packageId": "com.yashwin.appstore",
            "host": "rampawar123.github.io",
            "name": "YASHWIN APP STORE",
            "launcherName": "YASHWIN STORE",
            "display": "standalone",
            "themeColor": "#ff9800",
            "themeColorDark": "#101010",
            "navigationColor": "#101010",
            "navigationColorDark": "#101010",
            "navigationDividerColor": "#101010",
            "navigationDividerColorDark": "#101010",
            "backgroundColor": "#101010",
            "enableNotifications": true,
            "startUrl": "/yashwin-app-store/index.html",
            "iconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512.png",
            "maskableIconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512-maskable.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionCode": 1,
            "appVersion": "1.0",
            "shortcuts": [],
            "generatorApp": "Bubblewrap",
            "webManifestUrl": "https://rampawar123.github.io/yashwin-app-store/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "minSdkVersion": 23,
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          EOF

      - name: Generate Android project
        run: |
          cd twa
          bubblewrap update \
            --manifest=twa-manifest.json \
            --skipVersionUpgrade

      - name: Build unsigned APK
        run: |
          cd twa
          bubblewrap build \
            --skipPwaValidation \
            --skipSigning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VANSH-CALCULATOR-APK
          path: |
            twa/app-release-unsigned-aligned.apk
            twa/app-release-unsigned.apk
          if-no-files-found: error
