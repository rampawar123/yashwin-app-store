name: Build VANSH CALCULATOR V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Bubblewrap and Expect
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get update
          sudo apt-get install -y expect

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          bubblewrap --version
          bubblewrap doctor

      - name: Create signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -f android.keystore

          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias vansh \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=VANSH CALCULATOR V2, OU=VANSH, O=VANSH, L=India, ST=Maharashtra, C=IN"

          test -f android.keystore

      - name: Create calculator TWA project
        run: |
          rm -rf calculator-twa
          mkdir -p calculator-twa

          cd calculator-twa

          cat > init.expect <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 300

          spawn bubblewrap init \
            --manifest="https://rampawar123.github.io/yashwin-app-store/calculator-manifest.json" \
            --directory="."

          expect {
            -re "Domain being opened in the TWA.*:" {
              send "rampawar123.github.io\r"
              exp_continue
            }

            -re "Name of the application.*:" {
              send "VANSH CALCULATOR V2\r"
              exp_continue
            }

            -re "Name to be shown on the Android Launcher.*:" {
              send "VANSH CALCULATOR\r"
              exp_continue
            }

            -re "Color to be used for the status bar.*:" {
              send "\r"
              exp_continue
            }

            -re "Color to be used for the splash screen background.*:" {
              send "\r"
              exp_continue
            }

            -re "Relative path to open the TWA.*:" {
              send "/\r"
              exp_continue
            }

            -re "URL to an image that is at least 512.*:" {
              send "\r"
              exp_continue
            }

            -re "URL to an image that is at least 512.*maskable.*:" {
              send "\r"
              exp_continue
            }

            -re "Include app shortcuts.*" {
              send "n\r"
              exp_continue
            }

            -re "Android Package Name.*Application ID.*:" {
              send "com.vansh.calculator.v2\r"
              exp_continue
            }

            -re "Location of the Signing Key.*:" {
              send "../android.keystore\r"
              exp_continue
            }

            -re "Key name.*:" {
              send "vansh\r"
              exp_continue
            }

            eof
          }

          catch wait result
          exit [lindex $result 3]
          EXPECT

          chmod +x init.expect
          ./init.expect

          test -f twa-manifest.json
          echo "TWA MANIFEST CREATED"
          ls -lh twa-manifest.json

      - name: Check generated TWA project
        run: |
          test -f calculator-twa/twa-manifest.json
          test -f calculator-twa/gradlew

          echo "TWA PROJECT CREATED SUCCESSFULLY"
          echo "--------------------------------"
          ls -la calculator-twa

      - name: Build signed VANSH CALCULATOR V2 APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd calculator-twa

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="../android.keystore" \
            --signingKeyAlias="vansh"

      - name: Check APK
        run: |
          test -f calculator-twa/app-release-signed.apk

          echo "===================================="
          echo "VANSH CALCULATOR V2 APK CREATED"
          echo "===================================="

          ls -lh calculator-twa/app-release-signed.apk

      - name: Upload VANSH CALCULATOR V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: VANSH-CALCULATOR-V2
          path: |
            calculator-twa/app-release-signed.apk
            calculator-twa/app-release-signed.apk.idsig
            calculator-twa/app-release-bundle.aab
            calculator-twa/assetlinks.json
