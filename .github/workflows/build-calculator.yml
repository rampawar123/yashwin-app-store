name: Build VANSH CALCULATOR V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          bubblewrap --version
          bubblewrap doctor

      - name: Create signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -f android.keystore

          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias vansh \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=VANSH CALCULATOR V2, OU=VANSH, O=VANSH, L=India, ST=Maharashtra, C=IN"

          test -f android.keystore

      - name: Read calculator web manifest
        run: |
          curl -fsSL \
            "https://rampawar123.github.io/yashwin-app-store/calculator-manifest.json" \
            -o calculator-web-manifest.json

          cat calculator-web-manifest.json

      - name: Create TWA manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const web = JSON.parse(
            fs.readFileSync('calculator-web-manifest.json', 'utf8')
          );

          const base = 'https://rampawar123.github.io/yashwin-app-store/';

          const absolute = (value) => {
            if (!value) return null;
            return new URL(value, base).toString();
          };

          const icons = Array.isArray(web.icons) ? web.icons : [];

          let icon = icons.find(i =>
            i &&
            typeof i.src === 'string' &&
            /512x512|512/i.test(i.src)
          );

          if (!icon) {
            icon = icons.find(i =>
              i && typeof i.src === 'string'
            );
          }

          if (!icon) {
            throw new Error(
              'No icon found in calculator-manifest.json'
            );
          }

          const startUrl = new URL(
            web.start_url || '/',
            base
          );

          const manifest = {
            packageId: "com.vansh.calculator.v2",

            host: "rampawar123.github.io",

            name: web.name || "VANSH CALCULATOR V2",

            launcherName:
              web.short_name ||
              web.name ||
              "VANSH CALCULATOR",

            display: web.display || "standalone",

            themeColor:
              web.theme_color || "#000000",

            themeColorDark:
              web.theme_color || "#000000",

            navigationColor:
              web.background_color || "#000000",

            navigationColorDark:
              web.background_color || "#000000",

            navigationDividerColor: "#000000",

            navigationDividerColorDark: "#000000",

            backgroundColor:
              web.background_color || "#ffffff",

            enableNotifications: true,

            startUrl:
              startUrl.pathname + startUrl.search,

            iconUrl: absolute(icon.src),

            maskableIconUrl: absolute(icon.src),

            splashScreenFadeOutDuration: 300,

            signingKey: {
              path: "../android.keystore",
              alias: "vansh"
            },

            appVersionCode: 1,

            appVersion: "1.0.0",

            shortcuts: [],

            generatorApp: "Bubblewrap",

            webManifestUrl:
              "https://rampawar123.github.io/yashwin-app-store/calculator-manifest.json",

            fallbackType: "customtabs",

            features: {},

            alphaDependencies: {
              enabled: false
            },

            enableSiteSettingsShortcut: false,

            isChromeOSOnly: false,

            isMetaQuest: false,

            minSdkVersion: 23,

            orientation: "default",

            additionalTrustedOrigins: [],

            retainedBundles: []
          };

          fs.mkdirSync('calculator-twa', {
            recursive: true
          });

          fs.writeFileSync(
            'calculator-twa/twa-manifest.json',
            JSON.stringify(manifest, null, 2)
          );

          console.log(
            'TWA MANIFEST CREATED SUCCESSFULLY'
          );
          NODE

          cat calculator-twa/twa-manifest.json

      - name: Generate Android project
        run: |
          cd calculator-twa

          bubblewrap update \
            --manifest="."

          echo "ANDROID PROJECT GENERATED"

          test -f twa-manifest.json
          test -f gradlew

          chmod +x gradlew

          ls -la

      - name: Build signed VANSH CALCULATOR V2 APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd calculator-twa

          bubblewrap build \
            --manifest="." \
            --skipPwaValidation \
            --signingKeyPath="../android.keystore" \
            --signingKeyAlias="vansh"

      - name: Check APK
        run: |
          test -f calculator-twa/app-release-signed.apk

          echo "======================================"
          echo "VANSH CALCULATOR V2 APK READY"
          echo "======================================"

          ls -lh calculator-twa/app-release-signed.apk

      - name: Upload VANSH CALCULATOR V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: VANSH-CALCULATOR-V2
          path: |
            calculator-twa/app-release-signed.apk
            calculator-twa/app-release-signed.apk.idsig
            calculator-twa/app-release-bundle.aab
            calculator-twa/assetlinks.json
