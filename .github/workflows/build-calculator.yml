name: Build VANSH CALCULATOR V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          bubblewrap --version
          bubblewrap doctor

      - name: Create signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -f android.keystore

          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias vansh \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=VANSH CALCULATOR V2, OU=VANSH, O=VANSH, L=India, ST=Maharashtra, C=IN"

          test -f android.keystore

      - name: Read calculator web manifest
        run: |
          curl -fsSL \
            "https://rampawar123.github.io/yashwin-app-store/calculator-manifest.json" \
            -o calculator-web-manifest.json

          cat calculator-web-manifest.json

      - name: Fix and create TWA manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const web = JSON.parse(
            fs.readFileSync('calculator-web-manifest.json', 'utf8')
          );

          const base = 'https://rampawar123.github.io/yashwin-app-store/';

          function absolute(value) {
            if (!value) return null;
            return new URL(value, base).toString();
          }

          let icon = null;

          if (Array.isArray(web.icons)) {
            icon = web.icons.find(i =>
              i &&
              typeof i.src === 'string' &&
              /512/i.test(i.src)
            );

            if (!icon) {
              icon = web.icons.find(i =>
                i && typeof i.src === 'string'
              );
            }
          }

          if (!icon && typeof web.iconUrl === 'string') {
            icon = {
              src: web.iconUrl
            };
          }

          if (!icon) {
            throw new Error(
              'No icon found in calculator-manifest.json'
            );
          }

          const iconUrl = absolute(icon.src);

          const startUrl = new URL(
            web.start_url || '/calculator.html',
            base
          );

          const manifest = {
            packageId: 'com.vansh.calculator.v2',

            host: 'rampawar123.github.io',

            name: web.name || 'VANSH CALCULATOR V2',

            launcherName:
              web.short_name ||
              web.name ||
              'VANSH CALCULATOR',

            display: web.display || 'standalone',

            themeColor:
              web.theme_color || '#101010',

            themeColorDark:
              web.theme_color || '#101010',

            navigationColor:
              web.background_color || '#101010',

            navigationColorDark:
              web.background_color || '#101010',

            navigationDividerColor: '#101010',

            navigationDividerColorDark: '#101010',

            backgroundColor:
              web.background_color || '#101010',

            enableNotifications: false,

            startUrl:
              startUrl.pathname +
              startUrl.search,

            iconUrl: iconUrl,

            maskableIconUrl: iconUrl,

            splashScreenFadeOutDuration: 300,

            signingKey: {
              path: '../android.keystore',
              alias: 'vansh'
            },

            appVersionCode: 2,

            appVersion: '2.0.0',

            shortcuts: [],

            generatorApp: 'bubblewrap-cli',

            webManifestUrl:
              base + 'calculator-manifest.json',

            fallbackType: 'customtabs',

            features: {},

            alphaDependencies: {
              enabled: false
            },

            enableSiteSettingsShortcut: true,

            isChromeOSOnly: false,

            isMetaQuest: false,

            orientation: 'any',

            fingerprints: [],

            additionalTrustedOrigins: [],

            retainedBundles: []
          };

          fs.writeFileSync(
            'twa-manifest.json',
            JSON.stringify(manifest, null, 2)
          );

          console.log('Using icon:', iconUrl);
          console.log(
            'Created twa-manifest.json successfully'
          );
          NODE

          cat twa-manifest.json

      - name: Generate Android project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -rf android

          bubblewrap init \
            --manifest twa-manifest.json \
            --directory android \
            --skipPwaValidation

      - name: Build signed VANSH CALCULATOR V2 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd android

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            assembleRelease

      - name: Check APK
        run: |
          find android -type f \
            -name "*.apk" \
            -print

      - name: Upload VANSH CALCULATOR V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: VANSH-CALCULATOR-V2-APK
          path: android/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
