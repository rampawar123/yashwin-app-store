name: Build VANSH CALCULATOR V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          bubblewrap --version
          bubblewrap doctor

      - name: Create signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -f android.keystore

          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias vansh \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=VANSH CALCULATOR V2, OU=VANSH, O=VANSH, L=India, ST=Maharashtra, C=IN"

      - name: Create TWA manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.vansh.calculator.v2",
            "host": "rampawar123.github.io",
            "name": "VANSH CALCULATOR V2",
            "launcherName": "VANSH CALCULATOR V2",
            "display": "standalone",
            "themeColor": "#101010",
            "themeColorDark": "#101010",
            "navigationColor": "#101010",
            "navigationColorDark": "#101010",
            "navigationDividerColor": "#101010",
            "navigationDividerColorDark": "#101010",
            "backgroundColor": "#101010",
            "enableNotifications": false,
            "startUrl": "/yashwin-app-store/calculator.html",
            "iconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512.png",
            "maskableIconUrl": "https://rampawar123.github.io/yashwin-app-store/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../android.keystore",
              "alias": "vansh"
            },
            "appVersionCode": 3,
            "appVersion": "3.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://rampawar123.github.io/yashwin-app-store/calculator-manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "orientation": "any",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          EOF

          cat twa-manifest.json

            - name: Generate Android project
        run: |
          rm -rf android
          mkdir -p android

          bubblewrap init \
            --manifest twa-manifest.json \
            --directory android \
            --skipPwaValidation

      - name: Build signed VANSH CALCULATOR V2 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Check APK
        run: |
          find android -type f -name "*.apk" -print

      - name: Upload VANSH CALCULATOR V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: VANSH-CALCULATOR-V2-APK
          path: android/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
