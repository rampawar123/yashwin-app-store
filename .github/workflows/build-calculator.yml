name: Build VANSH CALCULATOR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Create Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Create Calculator signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -f calculator.keystore

          keytool -genkeypair \
            -v \
            -keystore calculator.keystore \
            -alias calculator \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=VANSH CALCULATOR, OU=YASHWIN, O=YASHWIN, L=India, ST=Maharashtra, C=IN"

      - name: Create Calculator TWA manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -rf twa
          mkdir -p twa

          cp calculator.keystore twa/calculator.keystore

          cat > twa/twa-manifest.json <<EOF
          {
            "packageId": "com.yashwin.calculator",
            "host": "rampawar123.github.io",
            "name": "VANSH CALCULATOR",
            "launcherName": "VANSH CALCULATOR",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": true,
            "startUrl": "/yashwin-app-store/calculator.html",
            "iconUrl": "https://rampawar123.github.io/yashwin-app-store/calculator-logo.png",
            "maskableIconUrl": "https://rampawar123.github.io/yashwin-app-store/calculator-logo.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "calculator.keystore",
              "alias": "calculator"
            },
            "appVersionName": "1.0",
            "appVersionCode": 1
          }
          EOF

      - name: Prepare Bubblewrap project
        run: |
          cd twa
          bubblewrap update --appVersionName="1.0" --skipVersionUpgrade

      - name: Build signed Calculator APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd twa
          bubblewrap build --skipPwaValidation

      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: VANSH-CALCULATOR-APK
          path: |
            twa/app-release-signed.apk
