name: Build VANSH CALCULATOR APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'calculator.html'
      - 'calculator-logo.png'
      - 'icon-512.png'
      - '.github/workflows/build-calculator.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF2
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF2

      - name: Restore permanent Calculator signing key
        env:
          KEY_BASE64: ${{ secrets.CALCULATOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -e
          test -n "$KEY_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEY_BASE64" | base64 --decode > calculator-release.jks
          keytool -list \
            -keystore calculator-release.jks \
            -alias calculator-release \
            -storepass "$KEYSTORE_PASSWORD"

      - name: Create Calculator TWA manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p twa
          cp calculator-release.jks twa/calculator.keystore

          cat > twa/twa-manifest.json <<EOF2
          {
            "packageId": "com.yashwin.calculator",
            "host": "rampawar123.github.io",
            "name": "VANSH CALCULATOR",
            "launcherName": "VANSH CALCULATOR",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": true,
            "startUrl": "/yashwin-app-store/calculator.html",
            "iconUrl": "https://raw.githubusercontent.com/rampawar123/yashwin-app-store/main/calculator-logo.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/rampawar123/yashwin-app-store/main/calculator-logo.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "calculator.keystore",
              "alias": "calculator-release"
            },
            "appVersionName": "1.0.${GITHUB_RUN_NUMBER}",
            "appVersionCode": $((1000 + GITHUB_RUN_NUMBER))
          }
          EOF2

      - name: Prepare Bubblewrap project
        working-directory: twa
        run: bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

      - name: Build signed Calculator APK
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Publish Calculator APK to repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          test -s twa/app-release-signed.apk
          cp twa/app-release-signed.apk VANSH-CALCULATOR.apk
          mkdir -p public
          cp twa/app-release-signed.apk public/VANSH-CALCULATOR.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VANSH-CALCULATOR.apk public/VANSH-CALCULATOR.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest VANSH CALCULATOR APK"
            git push origin HEAD:main
          else
            echo "Calculator APK is already up to date"
          fi

      - name: Upload Calculator APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VANSH-CALCULATOR-APK
          path: twa/app-release-signed.apk
