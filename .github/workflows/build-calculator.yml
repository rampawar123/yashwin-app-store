name: Build VANSH CALCULATOR V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap for GitHub Actions
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          cat "$HOME/.bubblewrap/config.json"

      - name: Create signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -f android.keystore

          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias vansh \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=VANSH CALCULATOR V2, OU=VANSH, O=VANSH, L=India, ST=Maharashtra, C=IN"

      - name: Check Bubblewrap configuration
        run: |
          bubblewrap doctor

      - name: Create calculator TWA project
        run: |
          rm -rf calculator-twa
          mkdir -p calculator-twa

          cd calculator-twa

          bubblewrap init \
            --manifest="../calculator-manifest.json" \
            --directory="." \
            --skipPwaValidation

      - name: Build signed VANSH CALCULATOR V2 APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd calculator-twa

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="../android.keystore" \
            --signingKeyAlias="vansh"

      - name: Upload VANSH CALCULATOR V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: VANSH-CALCULATOR-V2
          path: |
            calculator-twa/app-release-signed.apk
            calculator-twa/app-release-signed.apk.idsig
            calculator-twa/app-release-bundle.aab
