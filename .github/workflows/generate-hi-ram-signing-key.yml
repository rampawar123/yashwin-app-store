name: Generate Hi Ram Permanent Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate permanent release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.HI_RAM_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HI_RAM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          mkdir -p hi-ram-signing-key
          keytool -genkeypair -v \
            -keystore hi-ram-signing-key/hi-ram-release.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias hiram-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HI RAM, OU=YASHWIN, O=YASHWIN, L=Maharashtra, ST=Maharashtra, C=IN"
          keytool -list -v \
            -keystore hi-ram-signing-key/hi-ram-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias hiram-release | grep -E "Alias name:|SHA256:"
          chmod 600 hi-ram-signing-key/hi-ram-release.jks
          cd hi-ram-signing-key
          zip -j ../HI-RAM-PERMANENT-SIGNING-KEY.zip hi-ram-release.jks

      - name: Upload permanent signing key artifact
        uses: actions/upload-artifact@v4
        with:
          name: HI-RAM-PERMANENT-SIGNING-KEY
          path: HI-RAM-PERMANENT-SIGNING-KEY.zip
          if-no-files-found: error
          retention-days: 90
          
