name: Build CRIC YUVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Check signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty or unavailable."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is empty or unavailable."
            exit 1
          fi

          echo "Signing secrets are available."

      - name: Create CRIC YUVA signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -f cric-yuva.keystore

          keytool -genkeypair \
            -v \
            -keystore cric-yuva.keystore \
            -storetype JKS \
            -storepass "${KEYSTORE_PASSWORD}" \
            -keypass "${KEY_PASSWORD}" \
            -alias cricyuva \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CRIC YUVA, OU=YASHWIN, O=YASHWIN, L=Maharashtra, ST=Maharashtra, C=IN"

      - name: Create CRIC YUVA TWA manifest
        run: |
          rm -rf twa-cric-yuva
          mkdir -p twa-cric-yuva

          cp cric-yuva.keystore twa-cric-yuva/cric-yuva.keystore

          cat > twa-cric-yuva/twa-manifest.json <<'EOF'
          {
            "packageId": "com.yashwin.cricyuva",
            "host": "rampawar123.github.io",
            "name": "CRIC YUVA",
            "launcherName": "CRIC YUVA",
            "display": "standalone",
            "themeColor": "#ff9800",
            "navigationColor": "#101010",
            "navigationColorDark": "#101010",
            "navigationDividerColor": "#101010",
            "navigationDividerColorDark": "#101010",
            "backgroundColor": "#101010",
            "enableNotifications": true,
            "startUrl": "/yashwin-app-store/cric-yuva/",
            "iconUrl": "https://raw.githubusercontent.com/rampawar123/yashwin-app-store/main/cric-yuva/cric-yuva-logo.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/rampawar123/yashwin-app-store/main/cric-yuva/cric-yuva-logo.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "cric-yuva.keystore",
              "alias": "cricyuva"
            },
            "appVersionName": "1.0",
            "appVersionCode": 1
          }
          EOF

      - name: Prepare Bubblewrap project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd twa-cric-yuva

          bubblewrap update \
            --manifest=twa-manifest.json \
            --appVersionName="1.0" \
            --skipVersionUpgrade

      - name: Build CRIC YUVA APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd twa-cric-yuva

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="cric-yuva.keystore" \
            --signingKeyAlias="cricyuva" \
            --signingKeyPassword="${KEY_PASSWORD}" \
            --signingStorePassword="${KEYSTORE_PASSWORD}"

      - name: Rename CRIC YUVA APK
        run: |
          cp twa-cric-yuva/app-release-signed.apk \
             twa-cric-yuva/CRIC-YUVA.apk

      - name: Upload CRIC YUVA APK
        uses: actions/upload-artifact@v4
        with:
          name: CRIC-YUVA-APK
          path: twa-cric-yuva/CRIC-YUVA.apk
