name: Build CRIC YUVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. NODE.JS
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # --------------------------------------------------
      # 3. JAVA 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 4. ANDROID SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      # --------------------------------------------------
      # 5. INSTALL ANDROID SDK PACKAGES
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0"


      # --------------------------------------------------
      # 6. INSTALL BUBBLEWRAP
      # --------------------------------------------------
      - name: Install Bubblewrap
        run: |
          set -e

          npm install -g @bubblewrap/cli@1.25.0


      # --------------------------------------------------
      # 7. CONFIGURE BUBBLEWRAP
      # --------------------------------------------------
      - name: Configure Bubblewrap
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          echo "Checking Android SDK command-line tools..."

          test -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$ANDROID_HOME/tools"

          ln -sfn \
            "$ANDROID_HOME/cmdline-tools/latest/bin" \
            "$ANDROID_HOME/bin"

          ln -sfn \
            "$ANDROID_HOME/cmdline-tools/latest/bin" \
            "$ANDROID_HOME/tools/bin"

          echo "Checking Build Tools..."

          test -d "$ANDROID_HOME/build-tools/36.1.0"
          test -f "$ANDROID_HOME/build-tools/36.1.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/36.1.0/zipalign"

          mkdir -p ~/.bubblewrap

          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat ~/.bubblewrap/config.json

          echo "SDK compatibility layout:"
          ls -la "$ANDROID_HOME" | head -40
          ls -la "$ANDROID_HOME/bin"
          ls -la "$ANDROID_HOME/tools/bin"


      # --------------------------------------------------
      # 8. CREATE SIGNING KEY
      # --------------------------------------------------
      - name: Create CRIC YUVA signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

        run: |
          set -e

          rm -f cric-yuva.keystore

          keytool -genkeypair \
            -v \
            -keystore cric-yuva.keystore \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias cricyuva \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CRIC YUVA, OU=YASHWIN, O=YASHWIN, L=Maharashtra, ST=Maharashtra, C=IN"


      # --------------------------------------------------
      # 9. CREATE CRIC YUVA TWA PROJECT
      # --------------------------------------------------
      - name: Create CRIC YUVA TWA project
        run: |
          set -e

          rm -rf twa-cric-yuva
          mkdir -p twa-cric-yuva

          cp cric-yuva.keystore \
            twa-cric-yuva/cric-yuva.keystore

          cat > twa-cric-yuva/twa-manifest.json <<'EOF'
          {
            "packageId": "com.yashwin.cricyuva",
            "host": "rampawar123.github.io",
            "name": "CRIC YUVA",
            "launcherName": "CRIC YUVA",
            "display": "standalone",
            "themeColor": "#f98000",
            "navigationColor": "#101010",
            "navigationColorDark": "#101010",
            "navigationDividerColor": "#101010",
            "navigationDividerColorDark": "#101010",
            "backgroundColor": "#101010",
            "enableNotifications": true,
            "startUrl": "/yashwin-app-store/cric-yuva/",
            "iconUrl": "https://raw.githubusercontent.com/rampawar123/yashwin-app-store/main/cric-yuva/cric-yuva-logo.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/rampawar123/yashwin-app-store/main/cric-yuva/cric-yuva-logo.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "cric-yuva.keystore",
              "alias": "cricyuva"
            },
            "appVersion": "1.0",
            "appVersionCode": 1
          }
          EOF

          echo "TWA manifest created successfully."

          echo "Checking manifest file..."

          test -f twa-cric-yuva/twa-manifest.json

          cat twa-cric-yuva/twa-manifest.json


      # --------------------------------------------------
      # 10. PREPARE BUBBLEWRAP PROJECT
      # --------------------------------------------------
      - name: Prepare Bubblewrap project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

        run: |
          set -e

          cd twa-cric-yuva

          echo "Java:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Checking Bubblewrap prerequisites..."

          test -d "$ANDROID_HOME/build-tools/36.1.0"
          test -f "$ANDROID_HOME/bin/sdkmanager"

          test -f twa-manifest.json

          echo "Running Bubblewrap doctor..."

          bubblewrap doctor

          echo "Generating Android project from twa-manifest.json..."

          bubblewrap update \
            --manifest=twa-manifest.json \
            --skipVersionUpgrade


      # --------------------------------------------------
      # 11. BUILD CRIC YUVA APK
      # --------------------------------------------------
      - name: Build CRIC YUVA APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

        run: |
          set -e

          cd twa-cric-yuva

          bubblewrap build \
            --skipPwaValidation \
            --skipSigning


      # --------------------------------------------------
      # 12. FIND GENERATED APK
      # --------------------------------------------------
      - name: Find generated APK
        id: find_apk
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_PATH=$(find twa-cric-yuva \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."

            echo "Generated files:"
            find twa-cric-yuva -type f | sort

            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 13. SIGN APK
      # --------------------------------------------------
      - name: Sign CRIC YUVA APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

        run: |
          set -e

          mkdir -p output

          APK="${{ steps.find_apk.outputs.apk_path }}"

          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --ks twa-cric-yuva/cric-yuva.keystore \
            --ks-key-alias cricyuva \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out output/CRIC-YUVA.apk \
            "$APK"


      # --------------------------------------------------
      # 14. VERIFY APK
      # --------------------------------------------------
      - name: Verify CRIC YUVA APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify \
            --verbose \
            output/CRIC-YUVA.apk


      # --------------------------------------------------
      # 15. UPLOAD APK AS GITHUB ARTIFACT
      # --------------------------------------------------
      - name: Upload CRIC YUVA APK
        uses: actions/upload-artifact@v4
        with:
          name: CRIC-YUVA-APK
          path: output/CRIC-YUVA.apk
          if-no-files-found: error


      # --------------------------------------------------
      # 16. SAVE APK TO REPOSITORY
      # --------------------------------------------------
      - name: Upload APK to repository
        run: |
          set -e

          cp output/CRIC-YUVA.apk CRIC-YUVA.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CRIC-YUVA.apk

          git commit \
            -m "Update CRIC YUVA APK" \
            || echo "No changes to commit"

          git push
