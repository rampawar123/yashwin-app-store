name: Build CRIC YUVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Create CRIC YUVA signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -f cric-yuva.keystore

          keytool -genkeypair \
            -v \
            -keystore cric-yuva.keystore \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias cricyuva \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CRIC YUVA, OU=YASHWIN, O=YASHWIN, L=Maharashtra, ST=Maharashtra, C=IN"

      - name: Create CRIC YUVA TWA project
        run: |
          rm -rf twa-cric-yuva
          mkdir -p twa-cric-yuva

          cp cric-yuva.keystore twa-cric-yuva/cric-yuva.keystore

          cat > twa-cric-yuva/twa-manifest.json <<'EOF'
          {
            "packageId": "com.yashwin.cricyuva",
            "host": "rampawar123.github.io",
            "name": "CRIC YUVA",
            "launcherName": "CRIC YUVA",
            "display": "standalone",
            "themeColor": "#f98000",
            "navigationColor": "#101010",
            "navigationColorDark": "#101010",
            "navigationDividerColor": "#101010",
            "navigationDividerColorDark": "#101010",
            "backgroundColor": "#101010",
            "enableNotifications": true,
            "startUrl": "/yashwin-app-store/cric-yuva/",
            "iconUrl": "https://raw.githubusercontent.com/rampawar123/yashwin-app-store/main/cric-yuva/cric-yuva-logo.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/rampawar123/yashwin-app-store/main/cric-yuva/cric-yuva-logo.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "cric-yuva.keystore",
              "alias": "cricyuva"
            },
            "appVersionName": "1.0",
            "appVersionCode": 1
          }
          EOF

      - name: Prepare Bubblewrap project
        run: |
          cd twa-cric-yuva

          mkdir -p ~/.bubblewrap

          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          bubblewrap doctor

          bubblewrap update \
            --manifest=twa-manifest.json \
            --skipVersionUpgrade

      - name: Build CRIC YUVA APK
        run: |
          cd twa-cric-yuva

          bubblewrap build \
            --skipPwaValidation \
            --skipSigning

      - name: Find generated APK
        id: find_apk
        run: |
          echo "Searching for generated APK..."

          APK_PATH=$(find twa-cric-yuva -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            find twa-cric-yuva -type f | sort
            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Sign CRIC YUVA APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          mkdir -p output

          APK="${{ steps.find_apk.outputs.apk_path }}"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks twa-cric-yuva/cric-yuva.keystore \
            --ks-key-alias cricyuva \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out output/CRIC-YUVA.apk \
            "$APK"

      - name: Verify CRIC YUVA APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            output/CRIC-YUVA.apk

      - name: Upload CRIC YUVA APK
        uses: actions/upload-artifact@v4
        with:
          name: CRIC-YUVA-APK
          path: output/CRIC-YUVA.apk
          if-no-files-found: error

      - name: Upload APK to repository
        run: |
          cp output/CRIC-YUVA.apk CRIC-YUVA.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CRIC-YUVA.apk

          git commit -m "Update CRIC YUVA APK" || echo "No changes to commit"

          git push
