name: Build CRIC YUVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cric-yuva-2/**'
      - '.github/workflows/build-cric-yuva.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Restore permanent CRIC YUVA signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CRIC_YUVA_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          mkdir -p twa-cric-yuva
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > twa-cric-yuva/cric-yuva-release.jks
          test -s twa-cric-yuva/cric-yuva-release.jks
          chmod 600 twa-cric-yuva/cric-yuva-release.jks

      - name: Create TWA configuration
        run: |
          cat > twa-cric-yuva/twa-manifest.json <<'EOF_MANIFEST'
          {
            "packageId": "com.yashwin.cricyuva",
            "host": "rampawar123.github.io",
            "name": "CRIC YUVA",
            "launcherName": "CRIC YUVA",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#ff5a00",
            "themeColorDark": "#ff5a00",
            "navigationColor": "#101010",
            "navigationColorDark": "#101010",
            "backgroundColor": "#0b0b0b",
            "enableNotifications": true,
            "startUrl": "/yashwin-app-store/cric-yuva-2/",
            "webManifestUrl": "https://rampawar123.github.io/yashwin-app-store/cric-yuva-2/manifest.webmanifest",
            "iconUrl": "https://rampawar123.github.io/yashwin-app-store/cric-yuva-2/cric-yuva-2-logo.png",
            "maskableIconUrl": "https://rampawar123.github.io/yashwin-app-store/cric-yuva-2/cric-yuva-2-logo.png",
            "splashScreenFadeOutDuration": 300,
            "minSdkVersion": 24,
            "signingKey": {
              "path": "cric-yuva-release.jks",
              "alias": "cricyuva-release"
            },
            "appVersionName": "2.0",
            "appVersionCode": 1000
          }
          EOF_MANIFEST
          python3 -m json.tool twa-cric-yuva/twa-manifest.json > /dev/null

      - name: Generate Android project
        working-directory: twa-cric-yuva
        run: bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

      - name: Build signed CRIC YUVA APK
        working-directory: twa-cric-yuva
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD"
          test -n "$BUBBLEWRAP_KEY_PASSWORD"
          bubblewrap build --skipPwaValidation --manifest=twa-manifest.json

      - name: Verify signed APK
        run: |
          set -e
          test -s twa-cric-yuva/app-release-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose twa-cric-yuva/app-release-signed.apk

      - name: Publish APK
        run: |
          set -e
          mkdir -p public
          cp twa-cric-yuva/app-release-signed.apk CRIC-YUVA.apk
          cp twa-cric-yuva/app-release-signed.apk public/CRIC-YUVA.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CRIC-YUVA.apk public/CRIC-YUVA.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; nothing to publish."
          else
            git commit -m "Publish CRIC YUVA APK"
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRIC-YUVA-APK
          path: twa-cric-yuva/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30
