name: Build Native YASHWIN APP STORE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build Store Web UI
        run: |
          npm ci
          npm run build
          mkdir -p store-android/app/src/main/assets/www
          cp -a dist/. store-android/app/src/main/assets/www/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PERMANENT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/permanent-release.jks"
          chmod 600 "$RUNNER_TEMP/permanent-release.jks"

      - name: Build signed Native APK
        working-directory: store-android
        env:
          STORE_KEYSTORE_FILE: ${{ runner.temp }}/permanent-release.jks
          STORE_KEYSTORE_ALIAS: ${{ secrets.PERMANENT_KEYSTORE_ALIAS }}
          STORE_KEYSTORE_PASSWORD: ${{ secrets.PERMANENT_KEYSTORE_PASSWORD }}
        run: |
          test -s "$STORE_KEYSTORE_FILE"
          test -n "$STORE_KEYSTORE_ALIAS"
          test -n "$STORE_KEYSTORE_PASSWORD"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK package, version and signature
        run: |
          APK="store-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep "package: name='com.yashwin.appstore' versionCode='278'"

          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | \
            sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')

          EXPECTED="4A2C07B23AB370B058D5FFF6F6B5C849F014B2C4A3FB656528CD7EB447FB007D"

          echo "APK certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload Native APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YASHWIN-APP-STORE-NATIVE-APK
          path: store-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
