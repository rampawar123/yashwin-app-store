<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VANSH CALCULATOR V2</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:16px;
    background:#101010;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.calculator{
    width:100%;
    max-width:650px;
    margin:auto;
}

/* TITLE */

h1{
    text-align:center;
    color:#ff9800;
    font-size:38px;
    margin:20px 0 28px;
}

/* DISPLAY */

.display{
    width:100%;
    height:145px;
    background:#222;
    border-radius:28px;
    padding:20px 25px;
    margin-bottom:24px;

    display:flex;
    align-items:flex-end;
    justify-content:flex-end;

    overflow:hidden;
}

#display{
    width:100%;
    text-align:right;

    font-size:48px;
    font-weight:400;

    white-space:nowrap;
    overflow-x:auto;

    scrollbar-width:none;
}

#display::-webkit-scrollbar{
    display:none;
}

/* BUTTON GRID */

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

/* BUTTON */

button{
    border:0;
    min-height:78px;

    border-radius:20px;

    background:#303030;
    color:#fff;

    font-size:27px;
    font-weight:bold;

    cursor:pointer;

    touch-action:manipulation;
}

button:active{
    transform:scale(.95);
}

/* ORANGE */

.operator,
.equal{
    background:#ff9800;
}

/* AC */

.clear{
    background:#d92323;
}

/* HISTORY HEADER */

.history-header{
    margin-top:34px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.history-header h2{
    margin:0;
    color:#ff9800;
    font-size:30px;
}

/* CLEAR HISTORY */

.clear-history{
    min-height:55px;
    padding:0 20px;

    background:#333;
    border-radius:16px;

    font-size:17px;
}

/* HISTORY BOX */

#history{
    margin-top:14px;

    height:260px;

    padding:12px;

    background:#181818;

    border-radius:20px;

    overflow-y:auto;
    overflow-x:hidden;
}

/* HISTORY ITEM */

.history-item{
    width:100%;

    display:flex;
    align-items:center;

    gap:10px;

    background:#292929;

    padding:12px;

    margin-bottom:10px;

    border-radius:14px;
}

/* HISTORY TEXT */

.history-text{
    flex:1;

    color:#fff;

    font-size:18px;

    word-break:break-word;
}

/* DELETE */

.delete-history{
    flex:0 0 46px;

    width:46px;
    min-height:44px;

    padding:0;

    border-radius:11px;

    background:#d92323;

    font-size:18px;
}

/* TOTAL */

.total-box{
    margin-top:14px;

    padding:15px 18px;

    min-height:75px;

    border:3px solid #ff9800;

    border-radius:20px;

    background:#222;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.total-title{
    color:#ff9800;
    font-size:25px;
    font-weight:bold;
}

.total-value{
    color:#fff;
    font-size:30px;
    font-weight:bold;

    max-width:60%;

    overflow-x:auto;
    white-space:nowrap;
}

/* HISTORY SCROLLBAR */

#history::-webkit-scrollbar{
    width:7px;
}

#history::-webkit-scrollbar-track{
    background:#222;
}

#history::-webkit-scrollbar-thumb{
    background:#ff9800;
    border-radius:10px;
}

/* MOBILE */

@media(max-width:450px){

    body{
        padding:10px;
    }

    h1{
        font-size:34px;
        margin-top:18px;
    }

    .display{
        height:145px;
        border-radius:27px;
    }

    #display{
        font-size:45px;
    }

    .buttons{
        gap:10px;
    }

    button{
        min-height:78px;
        border-radius:19px;
        font-size:26px;
    }

    #history{
        height:260px;
    }

    .history-text{
        font-size:17px;
    }
}

</style>
</head>


<body>

<div class="calculator">

<h1>VANSH CALCULATOR</h1>


<!-- DISPLAY -->

<div class="display">
    <div id="display">0</div>
</div>


<!-- BUTTONS -->

<div class="buttons">

    <button class="clear"
    onclick="clearAll()">AC</button>

    <button
    onclick="backspace()">⌫</button>

    <button
    onclick="percent()">%</button>

    <button class="operator"
    onclick="operatorPressed('/')">÷</button>


    <button
    onclick="numberPressed('7')">7</button>

    <button
    onclick="numberPressed('8')">8</button>

    <button
    onclick="numberPressed('9')">9</button>

    <button class="operator"
    onclick="operatorPressed('*')">×</button>


    <button
    onclick="numberPressed('4')">4</button>

    <button
    onclick="numberPressed('5')">5</button>

    <button
    onclick="numberPressed('6')">6</button>

    <button class="operator"
    onclick="operatorPressed('-')">−</button>


    <button
    onclick="numberPressed('1')">1</button>

    <button
    onclick="numberPressed('2')">2</button>

    <button
    onclick="numberPressed('3')">3</button>

    <button class="operator"
    onclick="operatorPressed('+')">+</button>


    <button
    onclick="numberPressed('0')">0</button>

    <button
    onclick="numberPressed('00')">00</button>

    <button
    onclick="decimalPressed()">.</button>

    <button class="equal"
    onclick="calculate()">=</button>

</div>


<!-- HISTORY -->

<div class="history-header">

    <h2>History</h2>

    <button class="clear-history"
    onclick="clearHistory()">
        CLEAR
    </button>

</div>


<div id="history"></div>


<!-- TOTAL -->

<div class="total-box">

    <div class="total-title">
        TOTAL
    </div>

    <div
    id="totalValue"
    class="total-value">
        0
    </div>

</div>

</div>


<script>

/* =========================================
   VANSH CALCULATOR
========================================= */

let expression = "";

let justCalculated = false;


/* DISPLAY */

function updateDisplay(){

    const display =
        document.getElementById("display");

    if(expression === ""){
        display.textContent = "0";
    }
    else{
        display.textContent =
            expression;
    }

    display.scrollLeft =
        display.scrollWidth;
}


/* NUMBER */

function numberPressed(value){

    /*
       New calculation after =
    */

    if(justCalculated){

        expression = "";
        justCalculated = false;
    }


    /*
       00 at empty display
    */

    if(expression === ""){

        if(value === "00"){
            expression = "0";
        }
        else{
            expression = value;
        }

    }

    else{

        /*
           Prevent 00000 at beginning
        */

        if(
            expression === "0" &&
            value !== "."
        ){

            expression = value;

        }
        else{

            expression += value;

        }

    }

    updateDisplay();
}


/* DECIMAL */

function decimalPressed(){

    if(justCalculated){

        expression = "";
        justCalculated = false;
    }


    /*
       Find current number
       after last operator
    */

    const parts =
        expression.split(/[+\-×÷]/);

    const currentNumber =
        parts[parts.length - 1];


    if(currentNumber.includes(".")){
        return;
    }


    if(
        expression === "" ||
        /[+\-×÷]$/.test(expression)
    ){

        expression += "0.";

    }
    else{

        expression += ".";

    }

    updateDisplay();
}


/* OPERATOR */

function operatorPressed(op){

    justCalculated = false;


    /*
       Empty expression
    */

    if(expression === ""){
        return;
    }


    /*
       If last character is operator,
       replace it
    */

    if(/[+\-×÷]$/.test(expression)){

        expression =
            expression.slice(0,-1)
            + symbol(op);

    }
    else{

        expression += symbol(op);

    }


    updateDisplay();
}


/* SYMBOL */

function symbol(op){

    if(op === "*"){
        return "×";
    }

    if(op === "/"){
        return "÷";
    }

    return op;
}


/* BACKSPACE */

function backspace(){

    if(justCalculated){

        expression = "";
        justCalculated = false;

    }
    else{

        expression =
            expression.slice(0,-1);

    }

    updateDisplay();
}


/* AC */

function clearAll(){

    expression = "";
    justCalculated = false;

    updateDisplay();
}


/* PERCENT */

function percent(){

    if(expression === ""){
        return;
    }


    /*
       Find last number
    */

    const match =
        expression.match(/(\d+\.?\d*)$/);

    if(!match){
        return;
    }


    const number =
        Number(match[1]);

    const result =
        number / 100;


    expression =
        expression.slice(
            0,
            expression.length -
            match[1].length
        )
        + format(result);


    updateDisplay();
}


/* =========================================
   CALCULATE
========================================= */

function calculate(){

    if(expression === ""){
        return;
    }


    /*
       Last character operator
       ho to calculation mat karo
    */

    if(/[+\-×÷]$/.test(expression)){
        return;
    }


    const original =
        expression;


    try{

        /*
           Convert display symbols
           into JavaScript operators
        */

        let math =
            expression
            .replace(/×/g,"*")
            .replace(/÷/g,"/");


        /*
           Only allow numbers/operators/dot
        */

        if(!/^[0-9+\-*/.\s]+$/.test(math)){
            return;
        }


        /*
           Calculate
        */

        const answer =
            Function(
                '"use strict"; return (' +
                math +
                ')'
            )();


        if(
            typeof answer !== "number" ||
            !Number.isFinite(answer)
        ){

            expression = "Error";

            updateDisplay();

            setTimeout(
                clearAll,
                1000
            );

            return;
        }


        const result =
            format(answer);


        /*
           Add History
        */

        addHistory(
            original,
            result
        );


        /*
           Show final answer
        */

        expression = result;

        justCalculated = true;

        updateDisplay();

    }
    catch(error){

        expression = "Error";

        updateDisplay();

        setTimeout(
            clearAll,
            1000
        );

    }
}


/* FORMAT NUMBER */

function format(number){

    if(
        !Number.isFinite(number)
    ){
        return "Error";
    }


    if(
        Number.isInteger(number)
    ){
        return String(number);
    }


    return String(
        Number(
            number.toFixed(10)
        )
    );
}


/* =========================================
   HISTORY
========================================= */

function addHistory(
    calculation,
    answer
){

    const history =
        document.getElementById(
            "history"
        );


    const item =
        document.createElement(
            "div"
        );

    item.className =
        "history-item";


    const text =
        document.createElement(
            "div"
        );

    text.className =
        "history-text";


    text.textContent =
        calculation
        + " = "
        + answer;


    const deleteButton =
        document.createElement(
            "button"
        );

    deleteButton.className =
        "delete-history";

    deleteButton.textContent =
        "🗑️";


    /*
       Delete only this calculation
    */

    deleteButton.onclick =
        function(){

            item.remove();

            updateTotal();

        };


    item.appendChild(text);

    item.appendChild(
        deleteButton
    );


    history.prepend(item);


    updateTotal();

}


/* =========================================
   TOTAL
========================================= */

function updateTotal(){

    let total = 0;


    const items =
        document.querySelectorAll(
            ".history-item"
        );


    items.forEach(
        function(item){

            const text =
                item.querySelector(
                    ".history-text"
                ).textContent;


            const parts =
                text.split("=");


            const answer =
                Number(
                    parts[
                        parts.length - 1
                    ]
                );


            if(!isNaN(answer)){

                total += answer;

            }

        }
    );


    document.getElementById(
        "totalValue"
    ).textContent =
        format(total);

}


/* =========================================
   CLEAR HISTORY
========================================= */

function clearHistory(){

    document.getElementById(
        "history"
    ).innerHTML = "";


    updateTotal();

}


/* =========================================
   KEYBOARD SUPPORT
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        const key =
            event.key;


        if(
            key >= "0" &&
            key <= "9"
        ){

            numberPressed(key);

        }

        else if(key === "."){

            decimalPressed();

        }

        else if(
            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/"
        ){

            operatorPressed(key);

        }

        else if(
            key === "Enter" ||
            key === "="
        ){

            calculate();

        }

        else if(
            key === "Backspace"
        ){

            backspace();

        }

        else if(
            key === "Escape"
        ){

            clearAll();

        }

        else if(key === "%"){

            percent();

        }

    }
);


/* START */

updateDisplay();

</script>

</body>
</html>
