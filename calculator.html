<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="VANSH CALCULATOR">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>VANSH CALCULATOR</title>
</head>
<body>
<div id="calculator">
  <h1>VANSH CALCULATOR</h1>
  <div id="display">0</div>
  <div class="keypad">
    <button id="clear" class="function">AC</button>
    <button id="backspace" class="function">⌫</button>
    <button id="percent" class="function">%</button>
    <button class="operator">÷</button>
    <button class="number">7</button><button class="number">8</button><button class="number">9</button><button class="operator">×</button>
    <button class="number">4</button><button class="number">5</button><button class="number">6</button><button class="operator">−</button>
    <button class="number">1</button><button class="number">2</button><button class="number">3</button><button class="operator">+</button>
    <button id="sign">±</button><button class="number">0</button><button class="number">.</button><button id="equals">=</button>
  </div>
  <div id="history">
    <div class="history-header"><h3>History</h3><button id="clearHistory">CLEAR</button></div>
    <div id="historyList"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
