<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANSH CALCULATOR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#101010;
  color:#fff;
  min-height:100vh;
  padding:16px;
}

.calculator{
  max-width:420px;
  margin:auto;
  background:#1b1b1b;
  border:2px solid #ff9800;
  border-radius:25px;
  padding:18px;
  box-shadow:0 0 25px rgba(255,152,0,.25);
}

.calculator-logo{
  display:block;
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:22px;
  margin:0 auto 10px;
}

.title{
  text-align:center;
  color:#ff9800;
  font-size:26px;
  font-weight:bold;
  margin-bottom:16px;
}

.display{
  background:#090909;
  border:2px solid #333;
  border-radius:15px;
  padding:14px;
  min-height:105px;
  margin-bottom:14px;
  text-align:right;
  overflow:hidden;
}

.expression{
  color:#aaa;
  font-size:18px;
  min-height:25px;
  word-break:break-all;
}

.result{
  color:#fff;
  font-size:34px;
  font-weight:bold;
  word-break:break-all;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

button{
  border:none;
  border-radius:18px;
  min-height:62px;
  font-size:25px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

.number{
  background:#292929;
  color:#fff;
}

.operator,
.equal{
  background:#ff9800;
  color:#111;
}

.action{
  background:#555;
  color:#fff;
}

.zero{
  grid-column:span 2;
}

.history-box,
.saved-box{
  margin-top:18px;
  background:#121212;
  border:1px solid #333;
  border-radius:18px;
  padding:14px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}

.section-title{
  color:#ff9800;
  font-size:22px;
  font-weight:bold;
}

.small-btn{
  min-height:38px;
  padding:6px 12px;
  border-radius:10px;
  font-size:14px;
  background:#555;
  color:#fff;
}

.history-item,
.saved-item{
  background:#222;
  border-radius:13px;
  padding:10px;
  margin-bottom:9px;
}

.math{
  font-size:17px;
  margin-bottom:8px;
  word-break:break-all;
}

.item-actions{
  display:flex;
  gap:6px;
}

.item-actions button{
  min-height:38px;
  flex:1;
  font-size:14px;
  border-radius:9px;
}

.delete-btn{
  background:#d32f2f;
  color:#fff;
}

.save-btn{
  background:#2e7d32;
  color:#fff;
}

.share-btn{
  background:#1565c0;
  color:#fff;
}

.empty{
