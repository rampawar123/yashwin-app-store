<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANSH CALCULATOR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#101010;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.calculator{
  width:100%;
  max-width:420px;
  padding:20px;
}

.title{
  text-align:center;
  color:#ff9800;
  font-size:28px;
  font-weight:bold;
  margin-bottom:20px;
}

.display{
  background:#1e1e1e;
  border:1px solid #444;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  text-align:right;
  min-height:100px;
  overflow:hidden;
}

.expression{
  color:#aaa;
  font-size:20px;
  min-height:28px;
}

.result{
  color:white;
  font-size:38px;
  font-weight:bold;
  margin-top:8px;
  overflow:hidden;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

button{
  border:0;
  border-radius:16px;
  min-height:70px;
  font-size:23px;
  font-weight:bold;
  cursor:pointer;
  background:#292929;
  color:white;
}

button:active{
  transform:scale(.96);
}

.operator{
  background:#ff9800;
  color:#111;
}

.action{
  background:#444;
}

.equal{
  background:#ff9800;
  color:#111;
}

.zero{
  grid-column:span 2;
}

.history-box{
  margin-top:20px;
  background:#1b1b1b;
  border-radius:16px;
  padding:15px;
}

.history-title{
  color:#ff9800;
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #333;
  gap:10px;
}

.history-text{
  font-size:16px;
  overflow:hidden;
  word-break:break-word;
}

.delete{
  min-height:40px;
  width:45px;
  font-size:18px;
  background:#333;
}

.clear-history{
  width:100%;
  min-height:48px;
  margin-top:12px;
  background:#ff9800;
  color:#111;
  font-size:17px;
}
</style>
</head>

<body>

<div class="calculator">
  <img src="calculator-logo.png" alt="VANSH CALCULATOR" class="calculator-logo">

  <div class="title">VANSH CALCULATOR</div>

  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="buttons">

    <button class="action" onclick="clearAll()">AC</button>
    <button class="action" onclick="backspace()">⌫</button>
    <button class="action" onclick="percent()">%</button>
    <button class="operator" onclick="chooseOperator('/')">÷</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="chooseOperator('*')">×</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="chooseOperator('-')">−</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="operator" onclick="chooseOperator('+')">+</button>

    <button class="zero" onclick="number('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="equal" onclick="calculate()">=</button>

  </div>

  <div class="history-box">

    <div class="history-title">Calculation History</div>

    <div id="history"></div>

    <button class="clear-history" onclick="clearHistory()">
      CLEAR HISTORY
    </button>

  </div>

</div>

<script>

let current = "0";
let previous = null;
let operator = null;
let waiting = false;

const result = document.getElementById("result");
const expression = document.getElementById("expression");
const historyBox = document.getElementById("history");

let history = JSON.parse(localStorage.getItem("vanshHistory") || "[]");

function updateDisplay(){
  result.textContent = current;

  if(previous !== null && operator){
    expression.textContent =
      previous + " " + displayOperator(operator);
  }else{
    expression.textContent = "";
  }
}

function displayOperator(op){
  if(op === "*") return "×";
  if(op === "/") return "÷";
  if(op === "-") return "−";
  return op;
}

function number(num){

  if(waiting){
    current = num;
    waiting = false;
  }else{
    current = current === "0" ? num : current + num;
  }

  updateDisplay();
}

function decimal(){

  if(waiting){
    current = "0.";
    waiting = false;
    updateDisplay();
    return;
  }

  if(!current.includes(".")){
    current += ".";
  }

  updateDisplay();
}
