<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>VANSH CALCULATOR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
  padding:10px;
}

/* MAIN APP */
.app{
  width:100%;
  max-width:520px;
  margin:auto;
  background:#191919;
  border:3px solid #ff9800;
  border-radius:30px;
  padding:14px;
  box-shadow:0 0 30px rgba(255,152,0,.20);
}

/* LOGO */
.logo{
  display:block;
  width:145px;
  height:145px;
  object-fit:cover;
  margin:2px auto 8px;
  border-radius:28px;
}

/* TITLE */
.title{
  text-align:center;
  color:#ff9800;
  font-size:clamp(26px,7vw,40px);
  font-weight:900;
  margin-bottom:16px;
}
  .version{
  text-align:center;
  color:#888;
  font-size:10px;
  font-weight:600;
  margin-top:-8px;
  margin-bottom:16px;
  }

/* CALCULATOR TOP */
.calculator{
  width:100%;
}

/* DISPLAY */
.display-box{
  background:#050505;
  border:3px solid #292929;
  border-radius:24px;
  min-height:125px;
  padding:18px 16px;
  margin-bottom:14px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.expression{
  width:100%;
  color:#aaa;
  font-size:clamp(22px,6vw,34px);
  text-align:right;
  white-space:nowrap;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
}

.expression::-webkit-scrollbar{
  display:none;
}

.result{
  width:100%;
  color:#fff;
  font-size:clamp(42px,11vw,62px);
  font-weight:900;
  text-align:right;
  white-space:nowrap;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  line-height:1.1;
}

.result::-webkit-scrollbar{
  display:none;
}

/* KEYPAD */
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.btn{
  border:0;
  min-height:72px;
  border-radius:22px;
  background:#292929;
  color:#fff;
  font-size:27px;
  font-weight:800;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:.08s;
}

.btn:active{
  transform:scale(.95);
}

.btn.function{
  background:#5a5a5a;
}

.btn.operator,
.btn.equal{
  background:#ff9800;
  color:#111;
}

.btn.zero{
  grid-column:span 2;
}

/* SECTIONS */
.section{
  margin-top:22px;
  background:#0e0e0e;
  border:2px solid #292929;
  border-radius:24px;
  padding:12px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:6px;
}

.section-title{
  color:#ff9800;
  font-size:23px;
  font-weight:900;
}

.clear-btn{
  border:0;
  background:#5b5b5b;
  color:#fff;
  border-radius:12px;
  padding:9px 14px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.count{
  color:#999;
  font-size:14px;
  margin-bottom:10px;
}

/* HISTORY LIST */
.history-list,
.saved-list{
  width:100%;
}

/* ONE HISTORY ROW */
.math-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:6px;
  background:#1b1b1b;
  border-radius:14px;
  padding:7px 7px 7px 10px;
  margin-bottom:6px;
  min-height:48px;
}

.math-text{
  min-width:0;
  overflow:hidden;
}

.math-expression{
  color:#fff;
  font-size:16px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.math-answer{
  color:#63d636;
  font-size:17px;
  font-weight:900;
  margin-left:5px;
}

/* SMALL ACTION BUTTONS */
.actions{
  display:flex;
  align-items:center;
  gap:4px;
}

.action-btn{
  width:34px;
  height:30px;
  min-width:34px;
  padding:0;
  border-radius:8px;
  border:1px solid #444;
  background:#151515;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  cursor:pointer;
}

.delete-btn{
  color:#ff3b30;
}

.save-btn{
  color:#38d85b;
}

.share-btn{
  color:#168cff;
}

.action-btn:active{
  transform:scale(.92);
}

/* TOTAL */
.total-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px dashed #555;
  margin-top:8px;
  padding:10px 4px 3px;
}

.total-label{
  color:#ff9800;
  font-size:15px;
  font-weight:900;
}

.total-value{
  color:#63d636;
  font-size:22px;
  font-weight:900;
}

/* EMPTY */
.empty{
  text-align:center;
  color:#777;
  padding:22px 5px;
  font-size:15px;
}

/* FOOTER */
.footer{
  text-align:center;
  color:#777;
  font-size:13px;
  margin:20px 0 5px;
}

/* MOBILE */
@media(max-width:420px){

  body{
    padding:5px;
  }

  .app{
    padding:10px;
    border-radius:25px;
  }

  .logo{
    width:120px;
    height:120px;
  }

  .title{
    font-size:28px;
    margin-bottom:12px;
  }

  .display-box{
    min-height:105px;
    padding:13px;
    border-radius:20px;
  }

  .buttons{
    gap:7px;
  }

  .btn{
    min-height:62px;
    border-radius:18px;
    font-size:24px;
  }

  .section{
    margin-top:18px;
    padding:9px;
  }

  .section-title{
    font-size:20px;
  }

  .math-row{
    padding:6px;
    min-height:44px;
  }

  .math-expression{
    font-size:14px;
  }

  .math-answer{
    font-size:15px;
  }

  .action-btn{
    width:31px;
    min-width:31px;
    height:27px;
    font-size:14px;
  }
}

/* VERY SMALL PHONES */
@media(max-width:350px){

  .logo{
    width:105px;
    height:105px;
  }

  .title{
    font-size:24px;
  }

  .btn{
    min-height:55px;
    font-size:21px;
  }

  .math-expression{
    font-size:13px;
  }

  .action-btn{
    width:28px;
    min-width:28px;
    height:25px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- LOGO -->
  <img
    class="logo"
    src="calculator-logo.png"
    alt="VANSH CALCULATOR"
    onerror="this.style.display='none'"
  >

  <div class="title">VANSH CALCULATOR</div>
  <div class="version">Version 2.0</div>

  <!-- COMPLETE CALCULATOR -->
  <div class="calculator">

    <div class="display-box">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>

    <div class="buttons">

      <button class="btn function" onclick="clearAll()">AC</button>
      <button class="btn function" onclick="backspace()">⌫</button>
      <button class="btn function" onclick="percentage()">%</button>
      <button class="btn operator" onclick="chooseOperator('/')">÷</button>

      <button class="btn" onclick="number('7')">7</button>
      <button class="btn" onclick="number('8')">8</button>
      <button class="btn" onclick="number('9')">9</button>
      <button class="btn operator" onclick="chooseOperator('*')">×</button>

      <button class="btn" onclick="number('4')">4</button>
      <button class="btn" onclick="number('5')">5</button>
      <button class="btn" onclick="number('6')">6</button>
      <button class="btn operator" onclick="chooseOperator('-')">−</button>

      <button class="btn" onclick="number('1')">1</button>
      <button class="btn" onclick="number('2')">2</button>
      <button class="btn" onclick="number('3')">3</button>
      <button class="btn operator" onclick="chooseOperator('+')">+</button>

      <button class="btn zero" onclick="number('0')">0</button>
      <button class="btn" onclick="decimal()">.</button>
      <button class="btn equal" onclick="calculate()">=</button>

    </div>
  </div>


  <!-- HISTORY -->
  <div class="section">

    <div class="section-head">
      <div class="section-title">Calculation History</div>
      <button class="clear-btn" onclick="clearHistory()">CLEAR</button>
    </div>

    <div id="historyCount" class="count">
      Total Maths: 0
    </div>

    <div id="history" class="history-list"></div>

    <div class="total-box">
      <span class="total-label">TOTAL (ALL MATHS)</span>
      <span id="historyTotal" class="total-value">0</span>
    </div>

  </div>


  <!-- SAVED MATHS -->
  <div class="section">

    <div class="section-head">
      <div class="section-title">Saved Maths</div>
      <button class="clear-btn" onclick="clearSaved()">CLEAR</button>
    </div>

    <div id="savedCount" class="count">
      Saved: 0
    </div>

    <div id="saved" class="saved-list"></div>

    <div class="total-box">
      <span class="total-label">TOTAL SAVED</span>
      <span id="savedTotal" class="total-value">0</span>
    </div>

  </div>


  <div class="footer">
    VANSH CALCULATOR • Offline First
  </div>

</div>


<script>

/* =========================
   CALCULATOR VARIABLES
========================= */

let current = "0";
let previous = null;
let operator = null;
let waiting = false;


/* =========================
   STORAGE
========================= */

let history = loadData("vanshHistory");
let saved = loadData("vanshSaved");


function loadData(key){
  try{
    return JSON.parse(localStorage.getItem(key)) || [];
  }catch(e){
    return [];
  }
}


function saveData(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}


/* =========================
   DISPLAY
========================= */

function displayOperator(op){

  if(op === "/") return "÷";
  if(op === "*") return "×";
  if(op === "-") return "−";
  return "+";
}


function updateDisplay(){

  /*
    IMPORTANT:
    During calculation the COMPLETE expression
    is shown on ONE LINE.
  */

  if(previous !== null && operator && !waiting){

    expression.textContent =
      formatNumber(previous) +
      " " +
      displayOperator(operator) +
      " " +
      formatNumber(current);

  }else if(previous !== null && operator && waiting){

    expression.textContent =
      formatNumber(previous) +
      " " +
      displayOperator(operator);

  }else{
    expression.textContent = "";
  }

  result.textContent = formatNumber(current);
}


/* =========================
   FORMAT NUMBER
========================= */

function formatNumber(value){

  if(value === null || value === undefined){
    return "";
  }

  let text = String(value);

  if(text.length > 16){
    let n = Number(value);

    if(Number.isFinite(n)){
      return n.toPrecision(10).replace(/\.?0+$/,"");
    }
  }

  return text;
}


/* =========================
   NUMBER
========================= */

function number(num){

  if(waiting){
    current = num;
    waiting = false;
  }else{

    if(current === "0"){
      current = num;
    }else{
      current += num;
    }
  }

  updateDisplay();
}


/* =========================
   DECIMAL
========================= */

function decimal(){

  if(waiting){
    current = "0.";
    waiting = false;
    updateDisplay();
    return;
  }

  if(!current.includes(".")){
    current += ".";
  }

  updateDisplay();
}


/* =========================
   OPERATOR
========================= */

function chooseOperator(op){

  const input = parseFloat(current);

  if(Number.isNaN(input)){
    return;
  }

  if(previous !== null && operator && !waiting){
    calculate(false);
  }

  previous = parseFloat(current);
  operator = op;
  waiting = true;

  updateDisplay();
}


/* =========================
   CALCULATE
========================= */

function calculate(addToHistory = true){

  if(previous === null || operator === null){
    return;
  }

  const second = parseFloat(current);

  if(Number.isNaN(second)){
    return;
  }

  let answer;

  if(operator === "+"){
    answer = previous + second;
  }

  if(operator === "-"){
    answer = previous - second;
  }

  if(operator === "*"){
    answer = previous * second;
  }

  if(operator === "/"){

    if(second === 0){
      alert("Cannot divide by zero");
      return;
    }

    answer = previous / second;
  }

  if(!Number.isFinite(answer)){
    alert("Invalid calculation");
    return;
  }

  const firstValue = previous;
  const usedOperator = operator;
  const secondValue = second;

  const expressionText =
    formatNumber(firstValue) +
    " " +
    displayOperator(usedOperator) +
    " " +
    formatNumber(secondValue);

  current = String(
    Number.isInteger(answer)
      ? answer
      : Number(answer.toFixed(12))
  );

  previous = null;
  operator = null;
  waiting = true;

  /*
    After =:
    expression disappears
    result shows answer
  */

  expression.textContent = "";
  result.textContent = formatNumber(current);

  if(addToHistory){

    addHistory(
      expressionText,
      current
    );
  }
}


/* =========================
   HISTORY
========================= */

function addHistory(expressionText,answer){

  history.unshift({
    expression:expressionText,
    answer:String(answer)
  });

  saveData("vanshHistory",history);

  renderHistory();
}


function renderHistory(){

  const box = document.getElementById("history");

  box.innerHTML = "";

  document.getElementById("historyCount").textContent =
    "Total Maths: " + history.length;

  if(history.length === 0){

    box.innerHTML =
      '<div class="empty">No calculations yet</div>';

  }else{

    history.forEach((item,index)=>{

      const row = document.createElement("div");

      row.className = "math-row";

      row.innerHTML = `
        <div class="math-text">
          <span class="math-expression">
            ${escapeHTML(item.expression)} =
          </span>
          <span class="math-answer">
            ${escapeHTML(item.answer)}
          </span>
        </div>

        <div class="actions">

          <button
            class="action-btn delete-btn"
            onclick="deleteHistory(${index})"
            title="Delete">
            🗑
          </button>

          <button
            class="action-btn save-btn"
            onclick="saveHistoryItem(${index})"
            title="Save">
            💾
          </button>

          <button
            class="action-btn share-btn"
            onclick="shareHistory(${index})"
            title="Share">
            🔗
          </button>

        </div>
      `;

      box.appendChild(row);
    });
  }

  updateHistoryTotal();
}


/* =========================
   HISTORY TOTAL
========================= */

function updateHistoryTotal(){

  let total = 0;

  history.forEach(item=>{

    const n = Number(item.answer);

    if(Number.isFinite(n)){
      total += n;
    }

  });

  document.getElementById("historyTotal").textContent =
    formatNumber(total);
}


/* =========================
   DELETE HISTORY
========================= */

function deleteHistory(index){

  history.splice(index,1);

  saveData("vanshHistory",history);

  renderHistory();
}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory(){

  if(history.length === 0){
    return;
  }

  if(confirm("Clear all calculation history?")){

    history = [];

    saveData("vanshHistory",history);

    renderHistory();
  }
}


/* =========================
   SAVE HISTORY ITEM
========================= */

function saveHistoryItem(index){

  const item = history[index];

  if(!item){
    return;
  }

  /*
    Prevent exact duplicate saved maths.
  */

  const exists = saved.some(x =>
    x.expression === item.expression &&
    x.answer === item.answer
  );

  if(!exists){

    saved.unshift({
      expression:item.expression,
      answer:item.answer
    });

    saveData("vanshSaved",saved);

    renderSaved();

  }else{

    alert("Already saved");
  }
}


/* =========================
   SAVED MATHS
========================= */

function renderSaved(){

  const box = document.getElementById("saved");

  box.innerHTML = "";

  document.getElementById("savedCount").textContent =
    "Saved: " + saved.length;

  if(saved.length === 0){

    box.innerHTML =
      '<div class="empty">No saved maths</div>';

  }else{

    saved.forEach((item,index)=>{

      const row = document.createElement("div");

      row.className = "math-row";

      row.innerHTML = `
        <div class="math-text">
          <span class="math-expression">
            ${escapeHTML(item.expression)} =
          </span>
          <span class="math-answer">
            ${escapeHTML(item.answer)}
          </span>
        </div>

        <div class="actions">

          <button
            class="action-btn delete-btn"
            onclick="deleteSaved(${index})"
            title="Delete">
            🗑
          </button>

          <button
            class="action-btn share-btn"
            onclick="shareSaved(${index})"
            title="Share">
            🔗
          </button>

        </div>
      `;

      box.appendChild(row);
    });
  }

  updateSavedTotal();
}


/* =========================
   SAVED TOTAL
========================= */

function updateSavedTotal(){

  let total = 0;

  saved.forEach(item=>{

    const n = Number(item.answer);

    if(Number.isFinite(n)){
      total += n;
    }

  });

  document.getElementById("savedTotal").textContent =
    formatNumber(total);
}


/* =========================
   DELETE SAVED
========================= */

function deleteSaved(index){

  saved.splice(index,1);

  saveData("vanshSaved",saved);

  renderSaved();
}


/* =========================
   CLEAR SAVED
========================= */

function clearSaved(){

  if(saved.length === 0){
    return;
  }

  if(confirm("Clear all saved maths?")){

    saved = [];

    saveData("vanshSaved",saved);

    renderSaved();
  }
}


/* =========================
   SHARE HISTORY
========================= */

async function shareHistory(index){

  const item = history[index];

  if(!item){
    return;
  }

  const text =
    "VANSH CALCULATOR\n" +
    item.expression +
    " = " +
    item.answer;

  await shareText(text);
}


/* =========================
   SHARE SAVED
========================= */

async function shareSaved(index){

  const item = saved[index];

  if(!item){
    return;
  }

  const text =
    "VANSH CALCULATOR\n" +
    item.expression +
    " = " +
    item.answer;

  await shareText(text);
}


/* =========================
   SHARE FUNCTION
========================= */

async function shareText(text){

  if(navigator.share){

    try{

      await navigator.share({
        title:"VANSH CALCULATOR",
        text:text
      });

    }catch(e){

      /* User cancelled share */
    }

  }else{

    try{

      await navigator.clipboard.writeText(text);

      alert("Calculation copied");

    }catch(e){

      alert(text);
    }
  }
}


/* =========================
   BACKSPACE
========================= */

function backspace(){

  if(waiting){
    return;
  }

  if(current.length <= 1){

    current = "0";

  }else{

    current = current.slice(0,-1);

  }

  updateDisplay();
}


/* =========================
   PERCENTAGE
========================= */

function percentage(){

  const value = parseFloat(current);

  if(Number.isNaN(value)){
    return;
  }

  current = String(value / 100);

  updateDisplay();
}


/* =========================
   CLEAR CALCULATOR
========================= */

function clearAll(){

  current = "0";
  previous = null;
  operator = null;
  waiting = false;

  expression.textContent = "";
  result.textContent = "0";
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   KEYBOARD SUPPORT
========================= */

document.addEventListener("keydown",function(e){

  if(e.key >= "0" && e.key <= "9"){
    number(e.key);
  }

  if(e.key === "."){
    decimal();
  }

  if(e.key === "+"){
    chooseOperator("+");
  }

  if(e.key === "-"){
    chooseOperator("-");
  }

  if(e.key === "*"){
    chooseOperator("*");
  }

  if(e.key === "/"){
    e.preventDefault();
    chooseOperator("/");
  }

  if(e.key === "Enter" || e.key === "="){
    calculate();
  }

  if(e.key === "Backspace"){
    backspace();
  }

  if(e.key === "Escape"){
    clearAll();
  }

});


/* =========================
   START APP
========================= */

renderHistory();
renderSaved();
updateDisplay();

</script>

</body>
</html>
