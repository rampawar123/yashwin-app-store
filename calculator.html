<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>VANSH CALCULATOR</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
}

.calculator{
    width:100%;
    max-width:650px;
    margin:auto;
}


/* TITLE */

h1{
    text-align:center;
    color:#ff9800;
    font-size:38px;
    margin:25px 0 30px;
}


/* DISPLAY */

.display{
    width:100%;
    min-height:145px;

    background:#222;

    border-radius:25px;

    padding:20px 25px;

    margin-bottom:25px;

    display:flex;
    align-items:flex-end;
    justify-content:flex-end;

    overflow:hidden;
}

#display{

    width:100%;

    text-align:right;

    font-size:45px;

    color:white;

    white-space:nowrap;

    overflow-x:auto;

    scrollbar-width:none;
}

#display::-webkit-scrollbar{
    display:none;
}


/* BUTTONS */

.buttons{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:14px;
}

button{

    border:none;

    min-height:78px;

    border-radius:20px;

    font-size:28px;

    font-weight:bold;

    color:white;

    background:#303030;

    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

.operator{
    background:#ff9800;
}

.clear{
    background:#d62828;
}

.equal{
    background:#ff9800;
}


/* HISTORY HEADER */

.history-header{

    margin-top:35px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.history-header h2{

    margin:0;

    color:#ff9800;

    font-size:30px;
}


/* CLEAR */

.clear-history{

    min-height:52px;

    padding:0 18px;

    font-size:17px;

    background:#333;

    border-radius:15px;
}


/* HISTORY BOX */

#history{

    margin-top:12px;

    height:240px;

    padding:12px;

    background:#181818;

    border-radius:18px;

    overflow-y:auto;

    overflow-x:hidden;
}


/* HISTORY ITEM */

.history-item{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    background:#292929;

    color:white;

    padding:12px;

    margin-bottom:10px;

    border-radius:13px;

    font-size:19px;
}


/* CALCULATION TEXT */

.history-text{

    flex:1;

    text-align:left;

    word-break:break-word;
}


/* DELETE BUTTON */

.delete-history{

    min-height:42px;

    width:45px;

    padding:0;

    border-radius:10px;

    background:#d62828;

    font-size:19px;

    flex-shrink:0;
}


/* TOTAL */

.total-box{

    margin-top:15px;

    background:#222;

    border:2px solid #ff9800;

    border-radius:18px;

    padding:15px 18px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.total-title{

    color:#ff9800;

    font-size:22px;

    font-weight:bold;
}

.total-value{

    color:white;

    font-size:28px;

    font-weight:bold;

    max-width:60%;

    overflow-x:auto;

    white-space:nowrap;
}


/* SCROLLBAR */

#history::-webkit-scrollbar{

    width:7px;
}

#history::-webkit-scrollbar-track{

    background:#222;

    border-radius:10px;
}

#history::-webkit-scrollbar-thumb{

    background:#ff9800;

    border-radius:10px;
}


/* MOBILE */

@media(max-width:450px){

    body{
        padding:10px;
    }

    h1{
        font-size:32px;
    }

    .display{
        min-height:125px;
        padding:20px;
    }

    #display{
        font-size:40px;
    }

    .buttons{
        gap:10px;
    }

    button{
        min-height:70px;
        font-size:24px;
        border-radius:17px;
    }

    .history-item{
        font-size:17px;
    }

    .total-title{
        font-size:20px;
    }

    .total-value{
        font-size:24px;
    }
}

</style>

</head>


<body>


<div class="calculator">


<h1>
VANSH CALCULATOR
</h1>


<!-- DISPLAY -->

<div class="display">

<div id="display">
0
</div>

</div>


<!-- BUTTONS -->

<div class="buttons">


<button
class="clear"
onclick="clearAll()">
AC
</button>


<button
onclick="backspace()">
⌫
</button>


<button
onclick="percent()">
%
</button>


<button
class="operator"
onclick="pressOperator('/')">
÷
</button>



<button onclick="pressNumber('7')">
7
</button>

<button onclick="pressNumber('8')">
8
</button>

<button onclick="pressNumber('9')">
9
</button>

<button
class="operator"
onclick="pressOperator('*')">
×
</button>



<button onclick="pressNumber('4')">
4
</button>

<button onclick="pressNumber('5')">
5
</button>

<button onclick="pressNumber('6')">
6
</button>

<button
class="operator"
onclick="pressOperator('-')">
−
</button>



<button onclick="pressNumber('1')">
1
</button>

<button onclick="pressNumber('2')">
2
</button>

<button onclick="pressNumber('3')">
3
</button>

<button
class="operator"
onclick="pressOperator('+')">
+
</button>



<!-- LAST ROW -->

<button onclick="pressNumber('0')">
0
</button>

<button onclick="pressNumber('00')">
00
</button>

<button onclick="pressDecimal()">
.
</button>

<button
class="equal"
onclick="calculate()">
=
</button>


</div>



<!-- HISTORY -->

<div class="history-header">

<h2>
History
</h2>

<button
class="clear-history"
onclick="clearHistory()">

CLEAR

</button>

</div>


<div id="history"></div>


<!-- TOTAL -->

<div class="total-box">

<div class="total-title">
TOTAL
</div>

<div
id="totalValue"
class="total-value">

0

</div>

</div>


</div>



<script>


/* =========================
   CALCULATOR VARIABLES
========================= */

let current = "0";

let firstNumber = null;

let operator = null;

let waitingForSecondNumber = false;


/* =========================
   DISPLAY
========================= */

function updateDisplay(){

    const display =
    document.getElementById("display");


    /*
       Operator select hone ke baad:
       5 +
    */

    if(
        firstNumber !== null &&
        operator !== null
    ){

        let text =
        cleanNumber(firstNumber)
        + " "
        + operatorSymbol(operator);


        /*
           Second number enter ho gaya:
           5 + 5
        */

        if(!waitingForSecondNumber){

            text +=
            " "
            + current;

        }


        display.textContent = text;

    }

    else{

        display.textContent =
        current;

    }


    display.scrollLeft =
    display.scrollWidth;
}


/* =========================
   NUMBER
========================= */

function pressNumber(value){

    /*
       Operator ke baad
       naya number
    */

    if(waitingForSecondNumber){

        if(value === "00"){

            current = "0";

        }
        else{

            current = value;

        }

        waitingForSecondNumber =
        false;

    }

    else{

        if(current === "0"){

            if(value === "00"){

                current = "0";

            }
            else{

                current = value;

            }

        }
        else{

            current += value;

        }

    }


    updateDisplay();
}


/* =========================
   OPERATOR
========================= */

function pressOperator(newOperator){

    const number =
    parseFloat(current);


    /*
       First operator
    */

    if(firstNumber === null){

        firstNumber = number;

    }


    /*
       Agar previous calculation
       pending hai
    */

    else if(
        !waitingForSecondNumber
    ){

        const result =
        performCalculation(
            firstNumber,
            number,
            operator
        );


        if(!Number.isFinite(result)){

            current = "Error";

            firstNumber = null;

            operator = null;

            waitingForSecondNumber = true;

            updateDisplay();

            return;

        }


        firstNumber = result;

        current =
        cleanNumber(result);
    }


    operator =
    newOperator;


    waitingForSecondNumber =
    true;


    updateDisplay();
}


/* =========================
   CALCULATE
========================= */

function calculate(){

    if(
        firstNumber === null ||
        operator === null
    ){

        return;

    }


    /*
       Operator ke baad
       direct = nahi
    */

    if(waitingForSecondNumber){

        return;

    }


    const secondNumber =
    parseFloat(current);


    const result =
    performCalculation(
        firstNumber,
        secondNumber,
        operator
    );


    if(!Number.isFinite(result)){

        current = "Error";

        firstNumber = null;

        operator = null;

        waitingForSecondNumber = true;

        updateDisplay();

        return;

    }


    /*
       History expression
    */

    const expression =
    cleanNumber(firstNumber)
    + " "
    + operatorSymbol(operator)
    + " "
    + cleanNumber(secondNumber);


    const answer =
    cleanNumber(result);


    /*
       HISTORY ME ADD
    */

    addHistory(
        expression,
        answer
    );


    /*
       FINAL RESULT
    */

    current = answer;

    firstNumber = null;

    operator = null;

    waitingForSecondNumber = false;


    updateDisplay();
}


/* =========================
   CALCULATION ENGINE
========================= */

function performCalculation(
    a,
    b,
    op
){

    switch(op){

        case "+":

            return a + b;


        case "-":

            return a - b;


        case "*":

            return a * b;


        case "/":

            if(b === 0){

                return NaN;

            }

            return a / b;


        default:

            return b;
    }
}


/* =========================
   PERCENT
========================= */

function percent(){

    const number =
    parseFloat(current);


    if(isNaN(number)){

        return;

    }


    current =
    cleanNumber(
        number / 100
    );


    updateDisplay();
}


/* =========================
   DECIMAL
========================= */

function pressDecimal(){

    if(waitingForSecondNumber){

        current = "0.";

        waitingForSecondNumber =
        false;

    }

    else if(
        !current.includes(".")
    ){

        current += ".";

    }


    updateDisplay();
}


/* =========================
   BACKSPACE
========================= */

function backspace(){

    if(waitingForSecondNumber){

        return;

    }


    if(current.length <= 1){

        current = "0";

    }

    else{

        current =
        current.slice(0,-1);

    }


    updateDisplay();
}


/* =========================
   AC
========================= */

function clearAll(){

    current = "0";

    firstNumber = null;

    operator = null;

    waitingForSecondNumber =
    false;


    updateDisplay();
}


/* =========================
   OPERATOR SYMBOL
========================= */

function operatorSymbol(op){

    if(op === "*"){

        return "×";

    }


    if(op === "/"){

        return "÷";

    }


    if(op === "-"){

        return "−";

    }


    return op;
}


/* =========================
   ADD HISTORY
========================= */

function addHistory(
    expression,
    answer
){

    const history =
    document.getElementById(
        "history"
    );


    /*
       History item
    */

    const item =
    document.createElement(
        "div"
