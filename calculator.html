<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANSH CALCULATOR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  padding:12px;
}

.calculator{
  width:100%;
  max-width:520px;
  margin:auto;
  border:2px solid #ff9800;
  border-radius:28px;
  padding:18px;
  background:#151515;
}

/* TITLE */
.title{
  text-align:center;
  color:#ff9800;
  font-size:28px;
  font-weight:bold;
  margin:8px 0 18px;
}

/* DISPLAY */
.display{
  background:#050505;
  border:2px solid #333;
  border-radius:22px;
  min-height:125px;
  padding:18px;
  margin-bottom:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.expression{
  color:#aaa;
  font-size:20px;
  text-align:right;
  min-height:28px;
  white-space:nowrap;
  overflow:hidden;
}

.result{
  color:white;
  font-size:42px;
  font-weight:bold;
  text-align:right;
  white-space:nowrap;
  overflow:hidden;
}

/* BUTTONS */
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

button{
  border:0;
  border-radius:18px;
  min-height:70px;
  font-size:26px;
  font-weight:bold;
  color:white;
  background:#292929;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

.function{
  background:#555;
}

.operator,
.equal{
  background:#ff9800;
  color:#111;
}

.zero{
  grid-column:span 2;
}

/* HISTORY */
.box{
  margin-top:22px;
  border:2px solid #292929;
  border-radius:22px;
  padding:14px;
  background:#101010;
}

.box-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.box-title h2{
  color:#ff9800;
  font-size:22px;
}

.clear{
  min-height:42px;
  padding:0 16px;
  font-size:16px;
  background:#555;
}

/* HISTORY ITEM */
.history-item{
  background:#202020;
  border-radius:18px;
  padding:10px;
  margin-bottom:9px;
  display:flex;
  align-items:center;
  gap:8px;
}

.math{
  flex:1;
  min-width:0;
}

.math-text{
  font-size:18px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.answer{
  color:#55d61f;
  font-weight:bold;
}

.time{
  color:#999;
  font-size:12px;
  margin-top:3px;
}

/* SMALL ACTION BUTTONS */
.actions{
  display:flex;
  gap:5px;
}

.action{
  min-height:38px;
  width:38px;
  padding:0;
  border-radius:10px;
  font-size:17px;
}

.delete{
  background:#e53935;
}

.save{
  background:#249b35;
}

.share{
  background:#1976d2;
}

/* TOTAL */
.total{
  text-align:center;
  color:#aaa;
  font-size:14px;
  margin-top:10px;
}

.total span{
  color:#ff9800;
  font-weight:bold;
}

/* SAVED */
.saved-item{
  background:#202020;
  border-radius:15px;
  padding:12px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.no-data{
  text-align:center;
  color:#888;
  padding:22px 5px;
}

/* FOOTER */
.footer{
  margin-top:18px;
  padding:12px;
  border:2px solid #292929;
  border-radius:18px;
  text-align:center;
  color:#aaa;
  font-size:14px;
}

.footer span{
  color:#ff9800;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:380px){
  .calculator{
    padding:12px;
  }

  button{
    min-height:62px;
    font-size:23px;
  }

  .result{
    font-size:36px;
  }

  .history-item{
    padding:8px;
  }

  .action{
    width:34px;
    min-height:34px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="calculator">

  <div class="title">VANSH CALCULATOR</div>

  <!-- DISPLAY -->
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <!-- KEYPAD -->
  <div class="buttons">

    <button class="function" onclick="clearAll()">AC</button>
    <button class="function" onclick="backspace()">⌫</button>
    <button class="function" onclick="percent()">%</button>
    <button class="operator" onclick="chooseOperator('/')">÷</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="chooseOperator('*')">×</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="chooseOperator('-')">−</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="operator" onclick="chooseOperator('+')">+</button>

    <button class="zero" onclick="number('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="equal" onclick="calculate()">=</button>

  </div>

  <!-- HISTORY -->
  <div class="box">

    <div class="box-title">
      <h2>Calculation History</h2>
      <button class="clear" onclick="clearHistory()">CLEAR</button>
    </div>

    <div id="history"></div>

    <div class="total">
      Total History: <span id="historyTotal">0</span>
    </div>

  </div>

  <!-- SAVED MATHS -->
  <div class="box">

    <div class="box-title">
      <h2>Saved Maths</h2>
      <button class="clear" onclick="clearSaved()">CLEAR</button>
    </div>

    <div id="saved"></div>

    <div class="total">
      Total Saved: <span id="savedTotal">0</span>
    </div>

  </div>

  <div class="footer">
    Total Maths: <span id="footerHistory">0</span>
    &nbsp; | &nbsp;
    Total Saved: <span id="footerSaved">0</span>
  </div>

</div>

<script>

let current = "0";
let previous = null;
let operator = null;
let waiting = false;

let history = JSON.parse(
  localStorage.getItem("vanshHistory") || "[]"
);

let saved = JSON.parse(
  localStorage.getItem("vanshSaved") || "[]"
);

const result = document.getElementById("result");
const expression = document.getElementById("expression");


/* DISPLAY */
function updateDisplay(){

  result.textContent = current;

  if(previous !== null && operator){
    expression.textContent =
      formatNumber(previous) + " " +
      displayOperator(operator);
  }else{
    expression.textContent = "";
  }
}


/* NUMBER */
function number(num){

  if(waiting){
    current = num;
    waiting = false;
  }else{

    if(current === "0"){
      current = num;
    }else{
      current += num;
    }

  }

  updateDisplay();
}


/* DECIMAL */
function decimal(){

  if(waiting){
    current = "0.";
    waiting = false;
    updateDisplay();
    return;
  }

  if(!current.includes(".")){
    current += ".";
  }

  updateDisplay();
}


/* OPERATOR */
function chooseOperator(op){

  const input = parseFloat(current);

  if(isNaN(input)) return;

  if(previous !== null && operator && !waiting){
    calculate();
  }

  previous = parseFloat(current);
  operator = op;
  waiting = true;

  updateDisplay();
}


/* CALCULATE */
function calculate(){

  if(previous === null || operator === null){
    return;
  }

  const second = parseFloat(current);

  if(isNaN(second)) return;

  let answer;

  if(operator === "+"){
    answer = previous + second;
  }

  if(operator === "-"){
    answer = previous - second;
  }

  if(operator === "*"){
    answer = previous * second;
  }

  if(operator === "/"){

    if(second === 0){
      alert("Cannot divide by zero");
      return;
    }

    answer = previous / second;
  }

  const oldPrevious = previous;
  const oldOperator = operator;

  const expressionText =
    formatNumber(oldPrevious) +
    " " +
    displayOperator(oldOperator) +
    " " +
    formatNumber(second);

  current = formatNumber(answer);

  previous = null;
  operator = null;
  waiting = true;

  addHistory(
    expressionText,
    current
  );

  expression.textContent = expressionText;

  result.textContent = current;

}


/* FORMAT */
function formatNumber(num){

  if(Number.isInteger(Number(num))){
    return String(Number(num));
  }

  return String(Number(num));
}


/* OPERATOR DISPLAY */
function displayOperator(op){

  if(op === "/") return "÷";
  if(op === "*") return "×";
  if(op === "-") return "−";
  if(op === "+") return "+";

  return op;
}


/* CLEAR */
function clearAll(){

  current = "0";
  previous = null;
  operator = null;
  waiting = false;

  updateDisplay();
}


/* BACKSPACE */
function backspace(){

  if(waiting) return;

  if(current.length <= 1){
    current = "0";
  }else{
    current = current.slice(0,-1);
  }

  updateDisplay();
}


/* PERCENT */
function percent(){

  const value = parseFloat(current);

  if(isNaN(value)) return;

  current = String(value / 100);

  updateDisplay();
}


/* ADD HISTORY */
function addHistory(math,answer){

  const item = {
    id: Date.now(),
    math: math,
    answer: answer,
    time: new Date().toLocaleTimeString()
  };

  history.unshift(item);

  localStorage.setItem(
    "vanshHistory",
    JSON.stringify(history)
  );

  renderHistory();
}


/* HISTORY DISPLAY */
function renderHistory(){

  const box = document.getElementById("history");

  box.innerHTML = "";

  if(history.length === 0){

    box.innerHTML =
      '<div class="no-data">No calculation history</div>';

  }else{

    history.forEach(item => {

      const row = document.createElement("div");

      row.className = "history-item";

      row.innerHTML = `

        <div class="math">

          <div class="math-text">
            ${item.math} =
            <span class="answer">${item.answer}</span>
          </div>

          <div class="time">
            ${item.time}
          </div>

        </div>

        <div class="actions">

          <button
            class="action delete"
            onclick="deleteHistory(${item.id})">
            🗑
          </button>

          <button
            class="action save"
            onclick="saveMath(${item.id})">
            💾
          </button>

          <button
            class="action share"
            onclick="shareMath(${item.id})">
            🔗
          </button>

        </div>
      `;

      box.appendChild(row);

    });

  }

  document.getElementById("historyTotal").textContent =
    history.length;

  document.getElementById("footerHistory").textContent =
    history.length;
}


/* DELETE HISTORY */
function deleteHistory(id){

  history = history.filter(
    item => item.id !== id
  );

  localStorage.setItem(
    "vanshHistory",
    JSON.stringify(history)
  );

  renderHistory();
}


/* CLEAR HISTORY */
function clearHistory(){

  if(history.length === 0) return;

  if(confirm("Clear all calculation history?")){

    history = [];

    localStorage.setItem(
      "vanshHistory",
      JSON.stringify(history)
    );

    renderHistory();
  }
}


/* SAVE MATH */
function saveMath(id){

  const item = history.find(
    x => x.id === id
  );

  if(!item) return;

  if(saved.some(x => x.id === id)){

    alert("Already saved");

    return;
  }

  saved.unshift(item);

  localStorage.setItem(
    "vanshSaved",
    JSON.stringify(saved)
  );

  renderSaved();
}


/* SAVED DISPLAY */
function renderSaved(){

  const box = document.getElementById("saved");

  box.innerHTML = "";

  if(saved.length === 0){

    box.innerHTML =
      '<div class="no-data">No saved maths</div>';

  }else{

    saved.forEach(item => {

      const row = document.createElement("div");

      row.className = "saved-item";

      row.innerHTML = `

        <div>
          ${item.math} =
          <span class="answer">${item.answer}</span>
        </div>

        <button
          class="action delete"
          onclick="deleteSaved(${item.id})">
          🗑
        </button>

      `;

      box.appendChild(row);

    });

  }

  document.getElementById("savedTotal").textContent =
    saved.length;

  document.getElementById("footerSaved").textContent =
    saved.length;
}


/* DELETE SAVED */
function deleteSaved(id){

  saved = saved.filter(
    item => item.id !== id
  );

  localStorage.setItem(
    "vanshSaved",
    JSON.stringify(saved)
  );

  renderSaved();
}


/* CLEAR SAVED */
function clearSaved(){

  if(saved.length === 0) return;

  if(confirm("Clear all saved maths?")){

    saved = [];

    localStorage.setItem(
      "vanshSaved",
      JSON.stringify(saved)
    );

    renderSaved();
  }
}


/* SHARE */
async function shareMath(id){

  const item = history.find(
    x => x.id === id
  );

  if(!item) return;

  const text =
    item.math + " = " + item.answer;

  if(navigator.share){

    try{

      await navigator.share({
        title:"VANSH CALCULATOR",
        text:text
      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard.writeText(text);

      alert("Calculation copied");

    }catch(e){

      alert(text);

    }

  }
}


/* START */
updateDisplay();
renderHistory();
renderSaved();

</script>

</body>
</html>
